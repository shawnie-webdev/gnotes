  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  /**
   * Fetches data from a Supabase table.
   *
   * @param {string} tableName - Name of the table to query.
   * @param {Object|undefined} searchFor - Optional filter criteria (e.g., { id: '123' } or { name: 'John' }).
   * @returns {Promise<Array|Object|null>} Array of rows if no search filter, single object if filtered, or null on error.
   */
  async function fetchTable(tableName, searchFor = undefined) {
    try {
      let query = supabase.from(tableName).select('*');

      // If search criteria is provided, apply filters
      if (searchFor && typeof searchFor === 'object') {
        Object.keys(searchFor).forEach(key => {
          query = query.eq(key, searchFor[key]);
        });

        // Get single record matching criteria
        const { data, error } = await query.maybeSingle();
        if (error) throw error;
        return data;
      }

      // Return all records if no search filter is specified
      const { data, error } = await query;
      if (error) throw error;
      return data;

    } catch (error) {
      console.error(`Error fetching from table "${tableName}":`, error.message);
      return null;
    }
  }

  /**
   * Inserts a new record into a table or updates columns on existing record(s).
   *
   * @param {string} table - Name of the Supabase table.
   * @param {Object} data - Key-value pairs representing column names and their values.
   * @param {Object|undefined} matchCriteria - Optional criteria to target specific row(s) for an UPDATE.
   * @returns {Promise<Array|Object|null>} Inserted or updated record(s), or null on error.
   */
  async function newCol(table, data, matchCriteria = undefined) {
    try {
      let query;

      if (matchCriteria && typeof matchCriteria === 'object') {
        // MODE A: Update specific columns for an existing record
        query = supabase.from(table).update(data);

        Object.keys(matchCriteria).forEach(key => {
          query = query.eq(key, matchCriteria[key]);
        });
      } else {
        // MODE B: Insert a new row/record with column values
        query = supabase.from(table).insert([data]);
      }

      const { data: result, error } = await query.select();

      if (error) throw error;
      return result;

    } catch (error) {
      console.error(`Error executing newCol on table "${table}":`, error.message);
      return null;
    }
</script>
