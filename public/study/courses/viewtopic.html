<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoldenNotes</title>
    
    <link rel="stylesheet" href="../../master-combined.css">

    <!-- Supabase JS Client CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../auth/theme.js"></script>

</head>
<body>

<header class="top-header">
    <div class="nav-actions">
        <div class="header-left">
            <img src="../favicon.jpeg" alt="logo" id="logo">
        </div>
        <a href="/credits.html" class="btn btn-primary" id="credits">Credits</a>
        <a href="/" class="btn btn-secondary" id="dashboard">Homepage</a>
        <div class="dropdown">
            <button class="dropbtn btn btn-secondary">Study</button>
            <div class="dropdown-content">
                <a href="/corkboard" class="btn btn-secondary" id="cb">Corkboard</a>
                <a href="/study" class="btn btn-secondary" id="study">Study Guides</a>
                <a href="/documents" class="btn btn-secondary" id="documents">Documents</a>
                <a href="/calendar" class="btn btn-secondary" id="calendar">Calendar</a>
            </div>
        </div>

        <a href="/dashboard/settings" class="btn btn-secondary" id="settings-nav">Settings</a>
        <a href="/dashboard" class="btn btn-secondary" id="d-nav">Dashboard</a>
    </div>
</header>


<div class="hero-container">
    <div class="card">
        <h1 id="topic-head">Loading topic name...</h1>
        <strong>Loading author...</strong>

        <div id="main-container" class="hero-container">
            <div id="text-container" class="card">
                Loading content...
            </div>
        </div>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://cqxlnmvmfkylozcdffxf.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNxeGxubXZtZmt5bG96Y2RmZnhmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg3NDc4OTMsImV4cCI6MjEwNDMyMzg5M30.mpxEjcWdD9Vy0WsHRL7O8n1fWfnKInsBmOgaYsiv_38';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function loadTopicDetails() {
        const topichead = document.getElementById('topic-head');
        const textcontainer = document.getElementById('text-container');

        const urlParams = new URLSearchParams(window.location.search);
        const topicId = urlParams.get('id');

        if (!topicId) {
            topichead.textContent = "Topic Not Found";
            textcontainer.innerHTML = "<p>No topic ID provided in URL parameter (?id=...).</p>";
            return;
        }

        try {
            const { data: topic, error } = await supabaseClient
                .from('study')
                .select('*')
                .eq('id', topicId)
                .single();

            if (error) throw error;

            topichead.textContent = topic.name;
            textcontainer.innerHTML = "<div>" + topic.data + "</div>";
        } catch (err) {
            console.error("Error fetching record:", err);
            topichead.textContent = "Error Loading Topic";
            textcontainer.innerHTML = `<p style="color: #ef4444;">Failed to load topic details: ${escapeHtml(err.message)}</p>`;
        }
    }

    function parseContent(rawText) {
        let escaped = escapeHtml(rawText);

        const markdownLinkRegex = /\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g;
        escaped = escaped.replace(markdownLinkRegex, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');

        const imgRegex = /&lt;img src=&quot;(https?:\/\/[^\s&"]+)&quot; alt=&quot;([^&"]*)&quot;&gt;/g;
        escaped = escaped.replace(imgRegex, '<img src="$1" alt="$2">');

        return escaped;
    }

    function escapeHtml(str) {
        return String(str || '')
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;");
    }

    document.addEventListener('DOMContentLoaded', loadTopicDetails);
</script>
</body>
</html>
