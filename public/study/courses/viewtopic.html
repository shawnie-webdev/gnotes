<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoldenNotes</title>
    <link rel="stylesheet" href="./../style.css">

    <!-- Supabase JS Client CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        #main-container {
            display: flex;
            width: 80%;
            max-width: 1000px;
            min-height: 70vh;
            background-color: #05274a;
            border-radius: 12px;
            align-content: center;
            justify-content: center;
            margin: 30px auto;
            padding: 20px;
            box-sizing: border-box;
        }

        #text-container {
            width: 100%;
            background-color: mintcream;
            border-radius: 8px;
            padding: 24px;
            color: #000000;
            font-size: 1rem;
            line-height: 1.6;
            word-break: break-word;
            white-space: pre-wrap;
            box-sizing: border-box;
        }

        #text-container a {
            color: #60a5fa;
            text-decoration: underline;
        }

        #text-container img {
            max-width: 25%;
            height: auto;
            border-radius: 8px;
            margin: 15px 0;
            display: block;
        }

        h1#topic-head {
            text-align: center;
            margin-top: 20px;
            color: #ffffff;
        }

        #content-container p {
            margin-top: 0;
            margin-bottom: 0.5em; /* Controls vertical space between lines */
        }
    </style>
</head>
<body>
<header class="top-header">
    <div class="nav-actions">
        <div class="header-left">
            <img src="./../favicon.jpeg" alt="logo" id="logo">
        </div>
        <form action="/credits.html" method="get" style="display: inline;">
            <button type="submit" class="generic_button primary" id="credits">Credits</button>
        </form>
        <form action="/" method="get" style="display: inline;">
            <button type="submit" class="generic_button" id="dashboard">Homepage</button>
        </form>
        <form action="/corkboard" method="get" style="display: inline;">
            <button type="submit" class="generic_button" id="corkboard">Corkboard</button>
        </form>
        <form action="/study" method="get" style="display: inline;">
            <button type="submit" class="generic_button" id="study">Study</button>
        </form>
    </div>
</header>

<!-- FIXED: Added missing closing quote in id="topic-head" -->
<h1 id="topic-head">Loading topic name...</h1>

<div id="main-container">
    <div id="text-container">
        Loading content...
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://cqxlnmvmfkylozcdffxf.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNxeGxubXZtZmt5bG96Y2RmZnhmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg3NDc4OTMsImV4cCI6MjEwNDMyMzg5M30.mpxEjcWdD9Vy0WsHRL7O8n1fWfnKInsBmOgaYsiv_38';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function loadTopicDetails() {
        const topichead = document.getElementById('topic-head');
        const textcontainer = document.getElementById('text-container');

        // 1. Get ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        const topicId = urlParams.get('id');

        // Check if ID is missing from URL
        if (!topicId) {
            topichead.textContent = "Topic Not Found";
            textcontainer.innerHTML = "<p>No topic ID provided in URL parameter (?id=...).</p>";
            return;
        }

        try {
            // 2. Fetch row matching the ID from the 'study' table
            const { data: topic, error } = await supabaseClient
                .from('study')
                .select('*')
                .eq('id', topicId)
                .single();

            if (error) throw error;

            // 3. Render the fetched item
            topichead.textContent = topic.name;
            textcontainer.innerHTML = topic.data;
        } catch (err) {
            console.error("Error fetching record:", err);
            topichead.textContent = "Error Loading Topic";
            textcontainer.innerHTML = `<p style="color: #ef4444;">Failed to load topic details: ${escapeHtml(err.message)}</p>`;
        }
    }

    // Helper function to format markdown links and images while staying safe from XSS
    function parseContent(rawText) {
        let escaped = escapeHtml(rawText);

        // Convert [text](url) -> <a href="url" target="_blank">text</a>
        const markdownLinkRegex = /\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g;
        escaped = escaped.replace(markdownLinkRegex, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');

        // Restore safe <img> tags inserted from form toolbar
        const imgRegex = /&lt;img src=&quot;(https?:\/\/[^\s&"]+)&quot; alt=&quot;([^&"]*)&quot;&gt;/g;
        escaped = escaped.replace(imgRegex, '<img src="$1" alt="$2">');

        return escaped;
    }

    function escapeHtml(str) {
        return String(str || '')
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;");
    }

    document.addEventListener('DOMContentLoaded', loadTopicDetails);
</script>
</body>
</html>
