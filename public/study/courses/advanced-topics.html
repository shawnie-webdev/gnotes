<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GoldenNotes - Advanced Topics</title>

  <!-- Supabase JS Client CDN -->

</head>
<body>
  <header class="top-header">
    <div class="nav-actions">
      <form action="/credits.html" method="get" style="display: inline;">
        <button type="submit" class="generic_button primary" id="credits">Credits</button>
      </form>
      <form action="/credits.html" method="get" style="display: inline;">
        <button type="submit" class="generic_button" id="dashboard">Homepage</button>
      </form>
      <form action="/credits.html" method="get" id="corkboard" style="display: inline;">
        <button type="submit" class="generic_button" id="corkboard">Corkboard</button>
      </form>
    </div>
  </header>
  <div class="container">
    <h1>ADVANCED TOPICS</h1>
    <h3>Advanced topics, such as calculus, physics, chemistry, biology, and such, will be placed here instead of the standard topics in the Study Guides section.</h3>
 </div>
  <script>
    const SUPABASE_URL = 'https://cqxlnmvmfkylozcdffxf.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNxeGxubXZtZmt5bG96Y2RmZnhmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg3NDc4OTMsImV4cCI6MjEwNDMyMzg5M30.mpxEjcWdD9Vy0WsHRL7O8n1fWfnKInsBmOgaYsiv_38';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function loadTopicDetails() {
        const topichead = document.getElementById('topic-head');
        const textcontainer = document.getElementById('text-container');

        // 1. Get ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        const topicId = urlParams.get('id');

        // Check if ID is missing from URL
        if (!topicId) {
            topichead.textContent = "Topic Not Found";
            textcontainer.innerHTML = "<p>No topic ID provided in URL parameter (?id=...).</p>";
            return;
        }

        try {
            // 2. Fetch row matching the ID from the 'study' table
            const { data: topic, error } = await supabaseClient
                .from('study')
                .select('*')
                .eq('id', topicId)
                .single();

            if (error) throw error;

            // 3. Render the fetched item
            topichead.textContent = topic.name;
            textcontainer.innerHTML = "<div>" + topic.data + "</div>";

            console.log(textcontainer.innerHTML)
        } catch (err) {
            console.error("Error fetching record:", err);
            topichead.textContent = "Error Loading Topic";
            textcontainer.innerHTML = `<p style="color: #ef4444;">Failed to load topic details: ${escapeHtml(err.message)}</p>`;
        }
    }

    // Helper function to format markdown links and images while staying safe from XSS
    function parseContent(rawText) {
        let escaped = escapeHtml(rawText);

        // Convert [text](url) -> <a href="url" target="_blank">text</a>
        const markdownLinkRegex = /\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g;
        escaped = escaped.replace(markdownLinkRegex, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');

        // Restore safe <img> tags inserted from form toolbar
        const imgRegex = /&lt;img src=&quot;(https?:\/\/[^\s&"]+)&quot; alt=&quot;([^&"]*)&quot;&gt;/g;
        escaped = escaped.replace(imgRegex, '<img src="$1" alt="$2">');

        return escaped;
    }

    function escapeHtml(str) {
        return String(str || '')
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;");
    }

    document.addEventListener('DOMContentLoaded', loadTopicDetails);
</script>
  <script>
       const SUPABASE_URL = 'https://cqxlnmvmfkylozcdffxf.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNxeGxubXZtZmt5bG96Y2RmZnhmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg3NDc4OTMsImV4cCI6MjEwNDMyMzg5M30.mpxEjcWdD9Vy0WsHRL7O8n1fWfnKInsBmOgaYsiv_38';

        if (!window.supabase) {
            console.error("Supabase CDN failed to load. Check script inclusion.");
        }

        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Navigation listeners
        document.getElementById('add-topic').addEventListener('click', () => {
            window.location.href = "/study/new-topic";
        });

        document.getElementById('advanced-section').addEventListener('click', () => {
            window.location.href = "/study/advanced-topics";
        });

        async function displayStudyTopics(search = '') {
            const container = document.getElementById('topics-container');
            const info = document.getElementById('info');

            const { data: topics, error } = await supabaseClient
                .from('study')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                info.innerHTML = `<p style="color: #ef4444;">Failed to load topics: ${escapeHtml(error.message)}</p>`;
                return;
            }

            if (!topics || topics.length === 0) {
                info.innerHTML = `<p style="color: #cbd5e1;">No topics created yet.</p>`;
                return;
            }

            // Clear loading/info message
            info.innerHTML = '';
            let renderedCount = 0;

            topics.forEach(topic => {
                const subjectName = topic.subject?.name || 'General';
                const topicName = topic.name || '';

                if (topicName.toLowerCase().includes(search.toLowerCase())) {
                    renderedCount++;
                    
                    // FIXED: Changed span element to block div element
                    const card = document.createElement('div');
                    card.className = 'topic-card effect_button';

                    card.innerHTML = `
                        <div class="card-header" data-id="${topic.id}">
                            <span class="card-member badge-subject">${escapeHtml(subjectName)}</span>
                            <span class="card-member badge-sg">${escapeHtml(topic.sg || 'SG N/A')}</span>
                        </div>
                        <h3 class="card-member">${escapeHtml(topicName)}</h3>
                        <div class="card-member card-footer">
                            <small>By: ${escapeHtml(topic.author || 'Anonymous')}</small>
                        </div>
                    `;

                    card.addEventListener('click', () => {
                        window.location.href = `/study/view?id=${topic.id}`;
                    });

                    container.appendChild(card);
                }
            });

            if (renderedCount === 0) {
                info.innerHTML = `<p style="color: #cbd5e1;">No matching topics found for "${escapeHtml(search)}".</p>`;
            }
        }

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;");
        }

        // Initialization
        const params = new URLSearchParams(window.location.search);
        let searchparams = params.get("search");

        if (searchparams !== null) {
            searchparams = decodeURIComponent(searchparams).trim();
            document.getElementById('search-bar').value = searchparams;
            displayStudyTopics(searchparams);
        } else {
            document.addEventListener("DOMContentLoaded", () => displayStudyTopics());
        }
    </script>
</body>
