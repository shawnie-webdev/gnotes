<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>GoldenNotes - Create a New Topic</title>

        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <link rel="stylesheet" href="../master.css">

        <style>
            .button-container {
                display: flex;
                justify-content: center;
                align-items: center;
                width: 100%;
                margin: 30px auto;
            }

            #topics-container {
                display: grid;
                flex-direction: column;

                left: 100%;

                grid-template-columns: repeat(8, max-content);
                gap: 1rem;
                padding: 1px;
            }

            .topic-card {
                width: 250px;
                background-color: #4367a5;
                border-radius: 15px;

                border: 1px solid black;
                text-align: center;
            }

            .card-member {
                right: 20%;
            }

            #search-label {
                font-size: 18px;
            }

            #search-bar {
                width: 50%;
                height: 20%;

                font-size: 24px;
            }
        </style>
    </head>
    <body>

    <header class="top-header">
        <div class="nav-actions">
            <div class="header-left">
                <img src="./../favicon.jpeg" alt="logo" id="logo">
            </div>
            <form action="/credits.html" method="get" style="display: inline;">
                <button type="submit" class="generic_button primary" id="credits">Credits</button>
            </form>
            <form action="/public" method="get" style="display: inline;">
                <button type="submit" class="generic_button" id="dashboard">Homepage</button>
            </form>
            <form action="/corkboard" method="get" style="display: inline;">
                <button type="submit" class="generic_button" id="corkboard">Corkboard</button>
            </form>
            <form action="/study" method="get" style="display: inline;">
                <button type="submit" class="generic_button" id="study">Study</button>
            </form>
        </div>
    </header>

    <span class="height-15">
        <p>‎ </p>
        <form>
            <!-- The 'for' value must exactly match the input 'id' -->
            <label for="search-bar" id="search-label">Search a Topic:</label>
            <input type="text" id="search-bar" name="search">

            <button type="submit" class="generic_button">Submit</button>
        </form>
        <p>‎ </p>
    </span>

    <div id="topics-container" class="topics-grid">
        <h1 id="info">Loading topics...</h1>
    </div>
    <div id="button-container">
        <button class="generic_button" id="add-topic">Add a topic</button>
    </div>
        <div id="advanced-section" class="container">
            <button class="generic_button" id="advanced-section">Go to the Advanced Section</button>
        </div>

        <script>
            const SUPABASE_URL = 'https://cqxlnmvmfkylozcdffxf.supabase.co';
            const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNxeGxubXZtZmt5bG96Y2RmZnhmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg3NDc4OTMsImV4cCI6MjEwNDMyMzg5M30.mpxEjcWdD9Vy0WsHRL7O8n1fWfnKInsBmOgaYsiv_38';
        
            if (!window.supabase) {
                console.error("Supabase CDN failed to load. Check script inclusion.");
            }
        
            const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
            const button = document.getElementById('add-topic');
            button.addEventListener('click', () => {
                window.location.href = "/study/new-topic";
            });
        
            async function displayStudyTopics(search = '') {
                const container = document.getElementById('topics-container');
                const info = document.getElementById('info');
        
                const { data: topics, error } = await supabaseClient
                    .from('study')
                    .select('*')
                    .order('created_at', { ascending: false });
        
                if (error) {
                    info.innerHTML = `<p style="color: #ef4444;">Failed to load topics: ${escapeHtml(error.message)}</p>`;
                    return;
                }
        
                if (!topics || topics.length === 0) {
                    info.innerHTML = `<p style="color: #cbd5e1;">No topics created yet.</p>`;
                    return;
                }
        
                // Clear existing info banner
                info.innerHTML = '';
                let renderedCount = 0;
        
                topics.forEach(topic => {
                    const subjectName = topic.subject?.name || 'General';
                    const topicName = topic.name || '';
        
                    // FIXED: Use .includes() and handle case-insensitive filtering
                    if (topicName.toLowerCase().includes(search.toLowerCase())) {
                        renderedCount++;
                        const card = document.createElement('span');
                        card.className = 'topic-card effect_button';
        
                        card.innerHTML = `
                            <div class="card-header" data-id="${topic.id}">
                                <span class="card-member badge-subject">${escapeHtml(subjectName)}</span>
                                <span class="card-member badge-sg">${escapeHtml(topic.sg || 'SG N/A')}</span>
                            </div>
                            <h3 class="card-member">${escapeHtml(topicName)}</h3>
                            <div class="card-member card-footer">
                                <small>By: ${escapeHtml(topic.author || 'Anonymous')}</small>
                            </div>
                        `;
        
                        card.addEventListener('click', () => {
                            window.location.href = `/study/view?id=${topic.id}`;
                        });
        
                        container.appendChild(card);
                    }
                });
        
                if (renderedCount === 0) {
                    info.innerHTML = `<p style="color: #cbd5e1;">No matching topics found for "${escapeHtml(search)}".</p>`;
                }
            }
              const button = document.getElementById('advanced-section');
            button.addEventListener('click', () => {
                window.location.href = "/study/advanced-topics";
            });
            
            function escapeHtml(str) {
                return String(str)
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;");
            }
        
            // Initialize logic
            const params = new URLSearchParams(window.location.search);
            let searchparams = params.get("search");
        
            if (searchparams !== null) {
                searchparams = decodeURIComponent(searchparams).trim();
                document.getElementById('search-bar').value = searchparams;
                displayStudyTopics(searchparams);
            } else {
                // FIXED: Wrap in function to avoid passing DOM Event object to search parameter
                document.addEventListener("DOMContentLoaded", () => displayStudyTopics());
            }
        </script>
    </body>
</html>
