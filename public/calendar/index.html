<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoldenNotes - Calendar</title>

    <!-- Project Master Stylesheet -->
    <link rel="stylesheet" href="../master.css">

    <!-- Supabase JS Client & FullCalendar CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>

    <style>
        /* Essential FullCalendar dark theme variable overrides */
        .fc {
            --fc-border-color: #1e2d4a;
            --fc-page-bg-color: #151f32;
            --fc-neutral-bg-color: #0f172a;
            --fc-list-event-hover-bg-color: #1e293b;
            color: #cbd5e1;
        }

        .fc .fc-toolbar-title {
            color: #ffffff;
            font-size: 20px;
        }

        .fc .fc-button-primary {
            background-color: #1e293b;
            border-color: #334155;
            color: #ffffff;
        }

        .fc .fc-button-primary:hover {
            background-color: #334155;
            border-color: #475569;
        }

        .fc .fc-button-active {
            background-color: #ff6600 !important;
            border-color: #ff6600 !important;
        }

        .fc-theme-standard td, .fc-theme-standard th {
            border-color: #1e2d4a;
        }

        .fc .fc-daygrid-day-number,
        .fc .fc-col-header-cell-cushion {
            color: #cbd5e1;
            text-decoration: none;
        }
    </style>
</head>
<body>

<div class="calendar-container">
    <div class="header-bar">
        <h2>GoldenNotes Calendar</h2>
        <a href="/calendar/new" class="add-event-btn">
            <span>+</span> Add New Event
        </a>
    </div>

    <div id="error-box" class="error-msg"></div>

    <!-- Calendar Target Container -->
    <div id="calendar"></div>
</div>

<script>
    // Supabase Initialization
    const SUPABASE_URL = 'https://cqxlnmvmfkylozcdffxf.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNxeGxubXZtZmt5bG96Y2RmZnhmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg3NDc4OTMsImV4cCI6MjEwNDMyMzg5M30.mpxEjcWdD9Vy0WsHRL7O8n1fWfnKInsBmOgaYsiv_38';

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    document.addEventListener('DOMContentLoaded', async () => {
        const errorBox = document.getElementById('error-box');
        const calendarEl = document.getElementById('calendar');

        function showError(msg) {
            if (!errorBox) return;
            errorBox.textContent = msg;
            errorBox.style.display = 'block';
        }

        // Fetch events from Supabase
        const { data: eventsData, error } = await supabaseClient
            .from('calendar')
            .select('*');

        if (error) {
            console.error("Database fetch error:", error);
            showError("Failed to load events from Supabase: " + error.message);
        }

        // Map table rows to FullCalendar structure
        const formattedEvents = (eventsData || []).map(item => ({
            id: item.id,
            title: item.title,
            start: item.event_date,
            color: item.color || '#ff6600',
            extendedProps: {
                description: item.description || ''
            }
        }));

        // Render FullCalendar
        const calendar = new FullCalendar.Calendar(calendarEl, {
            initialView: 'dayGridMonth',
            headerToolbar: {
                left: 'prev,next today',
                center: 'title',
                right: 'dayGridMonth,listMonth'
            },
            events: formattedEvents,
            eventClick: function(info) {
                alert(`Event: ${info.event.title}\nDate: ${info.event.startStr}`);
            }
        });

        calendar.render();
    });
</script>

</body>
</html>
