<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoldenNotes - Calendar</title>

    <!-- Stylesheets -->
    <link rel="stylesheet" href="./../style.css">
    <link rel="stylesheet" href="./../master.css">

    <!-- Supabase JS Client & FullCalendar CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>

    <style>
        /* FullCalendar Light Theme Overrides */
        .fc {
            --fc-border-color: #e2e8f0;
            --fc-page-bg-color: #ffffff;
            --fc-neutral-bg-color: #f8fafc;
            --fc-list-event-hover-bg-color: #f1f5f9;
            color: #0f172a;
        }

        .fc .fc-toolbar-title {
            color: #0f172a;
            font-size: 20px;
            font-weight: bold;
        }

        .fc .fc-button-primary {
            background-color: #f1f5f9;
            border-color: #cbd5e1;
            color: #1e293b;
            font-weight: 600;
        }

        .fc .fc-button-primary:hover {
            background-color: #e2e8f0;
            border-color: #94a3b8;
            color: #0f172a;
        }

        .fc .fc-button-active {
            background-color: #ff6600 !important;
            border-color: #ff6600 !important;
            color: #ffffff !important;
        }

        .fc-theme-standard td, .fc-theme-standard th {
            border-color: #e2e8f0;
        }

        .fc .fc-daygrid-day-number,
        .fc .fc-col-header-cell-cushion {
            color: #334155;
            text-decoration: none;
            font-weight: 500;
        }

        .fc .fc-daygrid-day.fc-day-today {
            background-color: #fff7ed; /* Light highlight for today */
        }

        /* Container Spacing for Header Layout */
        .calendar-container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 24px;
            background-color: #ffffff;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .calendar-header-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .calendar-header-actions h2 {
            color: #0f172a;
        }

        .error-msg {
            display: none;
            background-color: #fef2f2;
            border: 1px solid #fca5a5;
            color: #991b1b;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 14px;
        }
    </style>
</head>
<body>

<!-- Top Header Navigation -->
<header class="top-header">
    <div class="nav-actions">
        <div class="header-left">
            <img src="./../favicon.jpeg" alt="logo" id="logo">
        </div>
        <form action="/credits.html" method="get" style="display: inline;">
            <button type="submit" class="generic_button primary" id="credits">Credits</button>
        </form>
        <form action="/" method="get" style="display: inline;">
            <button type="submit" class="generic_button" id="dashboard">Homepage</button>
        </form>
        <form action="/corkboard" method="get" style="display: inline;">
            <button type="submit" class="generic_button" id="corkboard">Corkboard</button>
        </form>
    </div>
</header>

<!-- Main Calendar View -->
<main class="calendar-container">
    <div class="calendar-header-actions">
        <h2>Calendar</h2>
        <form action="/calendar/new" method="get" style="display: inline;">
            <button type="submit" class="generic_button primary" id="add-event">+ Add Event</button>
        </form>
    </div>

    <div id="error-box" class="error-msg"></div>

    <!-- Calendar Mount Point -->
    <div id="calendar"></div>
</main>

<script>
    // Supabase Initialization
    const SUPABASE_URL = 'https://cqxlnmvmfkylozcdffxf.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNxeGxubXZtZmt5bG96Y2RmZnhmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg3NDc4OTMsImV4cCI6MjEwNDMyMzg5M30.mpxEjcWdD9Vy0WsHRL7O8n1fWfnKInsBmOgaYsiv_38';

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    document.addEventListener('DOMContentLoaded', async () => {
        const errorBox = document.getElementById('error-box');
        const calendarEl = document.getElementById('calendar');

        function showError(msg) {
            if (!errorBox) return;
            errorBox.textContent = msg;
            errorBox.style.display = 'block';
        }

        // Fetch events from Supabase
        const { data: eventsData, error } = await supabaseClient
            .from('calendar')
            .select('*');

        if (error) {
            console.error("Database fetch error:", error);
            showError("Failed to load events: " + error.message);
        }

        // Map Supabase rows to FullCalendar fields
        const formattedEvents = (eventsData || []).map(item => ({
            id: item.id,
            title: item.title,
            start: item.event_date,
            color: item.color || '#ff6600',
            extendedProps: {
                description: item.description || ''
            }
        }));

        // Render FullCalendar instance
        const calendar = new FullCalendar.Calendar(calendarEl, {
            initialView: 'dayGridMonth',
            headerToolbar: {
                left: 'prev,next today',
                center: 'title',
                right: 'dayGridMonth,listMonth'
            },
            events: formattedEvents,
            eventClick: function(info) {
                alert(`Event: ${info.event.title}\nDate: ${info.event.startStr}`);
            }
        });

        calendar.render();
    });
</script>
</body>
</html>
