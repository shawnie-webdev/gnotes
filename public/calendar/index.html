<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoldenNotes - Calendar</title>

    <!-- Stylesheets -->
    <link rel="stylesheet" href="./../style.css">
    <link rel="stylesheet" href="./../master.css">

    <!-- Supabase JS Client & FullCalendar CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>

    <style>
        /* FullCalendar Light Theme Overrides */
        .fc {
            --fc-border-color: #e2e8f0;
            --fc-page-bg-color: #ffffff;
            --fc-neutral-bg-color: #f8fafc;
            --fc-list-event-hover-bg-color: #f1f5f9;
            color: #0f172a;
        }

        .fc .fc-toolbar-title {
            color: #0f172a;
            font-size: 20px;
            font-weight: bold;
        }

        .fc .fc-button-primary {
            background-color: #f1f5f9;
            border-color: #cbd5e1;
            color: #1e293b;
            font-weight: 600;
        }

        .fc .fc-button-primary:hover {
            background-color: #e2e8f0;
            border-color: #94a3b8;
            color: #0f172a;
        }

        .fc .fc-button-active {
            background-color: #ff6600 !important;
            border-color: #ff6600 !important;
            color: #ffffff !important;
        }

        .fc-theme-standard td, .fc-theme-standard th {
            border-color: #e2e8f0;
        }

        .fc .fc-daygrid-day-number,
        .fc .fc-col-header-cell-cushion {
            color: #334155;
            text-decoration: none;
            font-weight: 500;
        }

        .fc .fc-daygrid-day.fc-day-today {
            background-color: #fff7ed;
        }

        .calendar-container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 24px;
            background-color: #ffffff;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .calendar-header-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .calendar-header-actions h2 {
            color: #0f172a;
            margin: 0;
        }

        .error-msg {
            display: none;
            background-color: #fef2f2;
            border: 1px solid #fca5a5;
            color: #991b1b;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 14px;
        }

        /* Event Details Card View */
        #event-detail-view {
            display: none;
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 24px;
        }

        .event-meta {
            margin: 15px 0 25px 0;
            display: flex;
            gap: 20px;
            font-size: 14px;
            color: #64748b;
        }

        .event-meta strong {
            color: #0f172a;
        }

        .event-description {
            background-color: #ffffff;
            border: 1px solid #cbd5e1;
            padding: 16px;
            border-radius: 6px;
            color: #334155;
            line-height: 1.6;
            white-space: pre-wrap;
            min-height: 100px;
        }

        .badge-color {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 6px;
        }
    </style>
</head>
<body>

<!-- Top Header Navigation -->
<header class="top-header">
    <div class="nav-actions">
        <div class="header-left">
            <img src="./../favicon.jpeg" alt="logo" id="logo">
        </div>
        <form action="/credits.html" method="get" style="display: inline;">
            <button type="submit" class="generic_button primary" id="credits">Credits</button>
        </form>
        <form action="/" method="get" style="display: inline;">
            <button type="submit" class="generic_button" id="dashboard">Homepage</button>
        </form>
        <form action="/corkboard" method="get" style="display: inline;">
            <button type="submit" class="generic_button" id="corkboard">Corkboard</button>
        </form>
    </div>
</header>

<!-- Main Container -->
<main class="calendar-container">
    <div class="calendar-header-actions">
        <h2 id="page-title">Calendar</h2>
        <div id="header-buttons">
            <form action="/calendar/new" method="get" style="display: inline;">
                <button type="submit" class="generic_button primary" id="add-event">+ Add Event</button>
            </form>
        </div>
    </div>

    <div id="error-box" class="error-msg"></div>

    <!-- Calendar View Target -->
    <div id="calendar"></div>

    <!-- Single Event Detail View Target -->
    <div id="event-detail-view">
        <h1 id="detail-title" style="color: #0f172a; margin-top: 0;">Loading Event...</h1>

        <div class="event-meta">
            <span><strong>Date:</strong> <span id="detail-date">-</span></span>
            <span><span id="detail-color-badge" class="badge-color"></span><strong>Category Tag</strong></span>
        </div>

        <h4 style="margin-bottom: 8px; color: #0f172a;">Description / Notes</h4>
        <div id="detail-description" class="event-description">No description provided.</div>

        <div style="margin-top: 24px;">
            <a href="/calendar" class="generic_button" style="text-decoration: none;">&larr; Back to Full Calendar</a>
        </div>
    </div>
</main>

<script>
    const SUPABASE_URL = 'https://cqxlnmvmfkylozcdffxf.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNxeGxubXZtZmt5bG96Y2RmZnhmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg3NDc4OTMsImV4cCI6MjEwNDMyMzg5M30.mpxEjcWdD9Vy0WsHRL7O8n1fWfnKInsBmOgaYsiv_38';

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    document.addEventListener('DOMContentLoaded', async () => {
        const errorBox = document.getElementById('error-box');
        const calendarEl = document.getElementById('calendar');
        const detailViewEl = document.getElementById('event-detail-view');
        const pageTitleEl = document.getElementById('page-title');
        const headerButtonsEl = document.getElementById('header-buttons');

        function showError(msg) {
            if (!errorBox) return;
            errorBox.textContent = msg;
            errorBox.style.display = 'block';
        }

        // 1. Check URL parameters for ?view=UUID
        const urlParams = new URLSearchParams(window.location.search);
        const eventId = urlParams.get('view');

        if (eventId) {
            // MODE A: Display Single Event Details
            calendarEl.style.display = 'none';
            detailViewEl.style.display = 'block';
            pageTitleEl.textContent = 'Event Details';

            // Adjust header action button
            headerButtonsEl.innerHTML = `
                <a href="/calendar" class="generic_button">&larr; Back to Calendar</a>
            `;

            try {
                const { data: event, error } = await supabaseClient
                    .from('calendar')
                    .select('*')
                    .eq('id', eventId)
                    .single();

                if (error) throw error;

                if (event) {
                    document.getElementById('detail-title').textContent = event.title || 'Untitled Event';
                    document.getElementById('detail-date').textContent = event.event_date || 'N/A';
                    document.getElementById('detail-description').textContent = event.description || 'No description provided for this event.';

                    const badge = document.getElementById('detail-color-badge');
                    badge.style.backgroundColor = event.color || '#ff6600';
                } else {
                    showError("Event not found.");
                }
            } catch (err) {
                console.error("Fetch event error:", err);
                showError("Failed to load event details: " + err.message);
            }

        } else {
            // MODE B: Display Full Calendar Grid
            const { data: eventsData, error } = await supabaseClient
                .from('calendar')
                .select('*');

            if (error) {
                console.error("Database fetch error:", error);
                showError("Failed to load events: " + error.message);
            }

            const formattedEvents = (eventsData || []).map(item => ({
                id: item.id,
                title: item.title,
                start: item.event_date,
                color: item.color || '#ff6600',
                extendedProps: {
                    description: item.description || ''
                }
            }));

            const calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'dayGridMonth',
                headerToolbar: {
                    left: 'prev,next today',
                    center: 'title',
                    right: 'dayGridMonth,listMonth'
                },
                events: formattedEvents,
                eventClick: function(info) {
                    if (info.event.id) {
                        window.location.href = `/calendar?view=${info.event.id}`;
                    }
                }
            });

            calendar.render();
        }
    });
</script>
</body>
</html>
