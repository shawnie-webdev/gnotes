<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoldenNotes - Add Event</title>
    <link rel="stylesheet" href="../master-combined.css">

    <!-- Supabase JS Client CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../auth/permissions.js"></script>

    <style>
        .floating-div {
            position: absolute;
            top: 55%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
            box-sizing: border-box;
        }

        #form {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        #form label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #475569;
            text-transform: uppercase;
        }

        .form-input, .form-textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 0.95rem;
            box-sizing: border-box;
        }

        .form-textarea {
            resize: vertical;
            min-height: 90px;
        }

        #submit-button {
            margin-top: 10px;
            width: 100%;
        }

        .nav-actions a {
            text-decoration: none;
            display: inline-block;
        }
    </style>
</head>
<body>

<header class="top-header">
    <div class="nav-actions">
        <div class="header-left">
            <img src="./../favicon.jpeg" alt="logo" id="logo">
        </div>
        <!-- Clean anchor tags instead of form wrappers -->
        <a href="/credits.html" class="btn btn-primary" id="credits">Credits</a>
        <a href="/" class="btn btn-secondary" id="dashboard">Homepage</a>
        <a href="/corkboard" class="btn btn-secondary" id="corkboard">Corkboard</a>
        <a href="/study" class="btn btn-secondary" id="study">Study Guides</a>
        <a href="/documents" class="btn btn-secondary">Documents</a>
        <a href="/calendar" class="btn btn-secondary">Calendar</a>
    </div>
</header>

<h1 class="centerx" style="text-align: center; margin-top: 30px;">Create an Event</h1>

<div class="floating-div">
    <form id="form" onsubmit="return false;">
        <div>
            <label for="event_name">Event name:</label>
            <input type="text" id="event_name" class="form-input" placeholder="Event Name" required>
        </div>

        <div>
            <label for="event_description">Event description:</label>
            <textarea id="event_description" class="form-textarea" placeholder="Event Description"></textarea>
        </div>

        <div>
            <label for="date">Date of event:</label>
            <input type="date" id="date" class="form-input" name="event-date" required>
        </div>

        <button type="submit" id="submit-button" class="btn btn-primary" disabled>Create Event</button>
    </form>
</div>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        const SUPABASE_URL = 'https://cqxlnmvmfkylozcdffxf.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNxeGxubXZtZmt5bG96Y2RmZnhmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg3NDc4OTMsImV4cCI6MjEwNDMyMzg5M30.mpxEjcWdD9Vy0WsHRL7O8n1fWfnKInsBmOgaYsiv_38';

        // Initialize inside block scope to avoid global collision
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function newCol(table, data, matchCriteria = undefined) {
            try {
                let query;
                if (matchCriteria && typeof matchCriteria === 'object') {
                    query = supabase.from(table).update(data);
                    Object.keys(matchCriteria).forEach(key => {
                        query = query.eq(key, matchCriteria[key]);
                    });
                } else {
                    query = supabase.from(table).insert([data]);
                }

                const { data: result, error } = await query.select();
                if (error) throw error;
                return result;
            } catch (error) {
                console.error(`Error executing newCol on table "${table}":`, error.message);
                return null;
            }
        }

        const form = document.getElementById("form");
        const submitButton = document.getElementById("submit-button");
        let canWrite = false;

        window.GoldenNotesPermissions.initWriteControls(supabase, submitButton).then((result) => {
            canWrite = result.canWrite;
            if (!canWrite) {
                submitButton.textContent = "Editor access required";
            }
        });

        form.addEventListener("submit", async (e) => {
            e.preventDefault();

            if (!canWrite) {
                alert("You do not have editor access to create calendar events.");
                return;
            }

            try {
                const name = document.getElementById("event_name").value;
                const desc = document.getElementById("event_description").value;
                const date = document.getElementById("date").value;

                const { data: { session }, error } = await supabase.auth.getSession();

                if (error || !session) {
                    alert("Please log in to create an event.");
                    return;
                }

                const result = await newCol("calendar", {
                    'title': name,
                    'event_date': date,
                    'description': desc,
                    'user_id': session.user.id
                });

                if (result) {
                    window.location.replace("/calendar");
                } else {
                    alert("Failed to create event. Check console for details.");
                }
            } catch (err) {
                console.error("Submission error:", err);
                alert("Failed to create event: " + err.message);
            }
        });
    });
</script>
</body>
</html>
