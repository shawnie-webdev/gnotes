<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoldenNotes - Dashboard</title>

    <!-- Supabase JS Client via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./theme.js"></script>

    <link rel="stylesheet" href="../master-combined.css">
    <style>
        .dashboard-container {
            max-width: 800px;
            margin: 0 auto;
            background-color: var(--bg-card);
            padding: 30px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-md);
        }

        .dashboard-container > .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            border-bottom: 1px solid var(--subtle-line);
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        .user-info {
            background-color: var(--secondary-navy);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            margin-bottom: 25px;
        }

        .user-info p {
            margin-bottom: 10px;
            color: var(--secondary-text);
            font-size: 16px;
            font-weight: 500;
        }

        .user-info span {
            color: var(--main-text);
            font-weight: bold;
        }

        #display-id {
            font-size: 12px;
            color: var(--muted-text) !important;
            word-break: break-all;
        }

        .logout-btn {
            background-color: var(--danger) !important;
            color: #fff !important;
            border-color: var(--danger) !important;
        }

        .logout-btn:hover {
            filter: brightness(0.92);
        }

        .dashboard-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<header class="top-header">
    <div class="nav-actions">
        <div class="header-left">
            <img src="./../favicon.jpeg" alt="logo" id="logo">
        </div>
        <form action="/credits.html" method="get" style="display: inline;">
            <button type="submit" class="btn btn-primary" id="credits">Credits</button>
        </form>
        <form action="/" method="get" style="display: inline;">
            <button type="submit" class="btn btn-secondary" id="dashboard">Homepage</button>
        </form>
        <form action="/corkboard" method="get" style="display: inline;">
            <button type="submit" class="btn btn-secondary" id="corkboard">Corkboard</button>
        </form>
        <form action="/study" method="get" style="display: inline;">
            <button type="submit" class="btn btn-secondary" id="study">Study Guides</button>
        </form>
        <form action="/documents" method="get" style="display: inline;">
            <button type="submit" class="btn btn-secondary">Documents</button>
        </form>
        <form action="/calendar" method="get" style="display: inline;">
            <button type="submit" class="btn btn-secondary">Calendar</button>
        </form>
        <a href="/dashboard/settings" class="btn btn-secondary" id="settings-nav">Settings</a>
    </div>
</header>

<div>
    <h1>‎ </h1>
    <h1>‎ </h1>
</div>

<div class="dashboard-container">
    <div class="header">
        <h2>Dashboard</h2>
        <button id="logout-btn" class="btn btn-secondary logout-btn">Log Out</button>
    </div>

    <div class="user-info">
        <p>Username: <span id="display-username">Loading...</span></p>
        <p>Email: <span id="display-email">Loading...</span></p>
        <p>User ID (UUID): <span id="display-id" style="font-size: 12px; color: #64748b;">Loading...</span></p>
    </div>

    <h3>Your Notes</h3>
    <p style="color: var(--muted-text); margin-top: 10px;">Your private note-taking area goes here.</p>

    <div class="dashboard-actions">
        <a href="/dashboard/settings" class="btn btn-primary">Open Settings</a>
    </div>
</div>

<script>
    // Ensure these match your login page credentials exactly
    const SUPABASE_URL = 'https://cqxlnmvmfkylozcdffxf.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNxeGxubXZtZmt5bG96Y2RmZnhmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg3NDc4OTMsImV4cCI6MjEwNDMyMzg5M30.mpxEjcWdD9Vy0WsHRL7O8n1fWfnKInsBmOgaYsiv_38';

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    document.addEventListener('DOMContentLoaded', async () => {
        const usernameEl = document.getElementById('display-username');
        const emailEl = document.getElementById('display-email');
        const idEl = document.getElementById('display-id');
        const logoutBtn = document.getElementById('logout-btn');

        // Function to verify and display user session
        async function loadUserProfile() {
            const { data: { session }, error } = await supabaseClient.auth.getSession();

            if (error || !session) {
                console.warn('No active session found.');
                // Update path to match where your login.html file lives relative to dashboard
                window.location.href = '/login';
                return;
            }

            const user = session.user;

            if (emailEl) emailEl.textContent = user.email;
            if (idEl) idEl.textContent = user.id;
            if (usernameEl) usernameEl.textContent = user.user_metadata?.username || 'No username set';
        }

        // Run initial auth check
        await loadUserProfile();

        // Listen for Auth state changes (handles logouts across tabs)
        supabaseClient.auth.onAuthStateChange((event, session) => {
            if (event === 'SIGNED_OUT' || !session) {
                window.location.href = '/login';
            }
        });

        // Handle Logout
        if (logoutBtn) {
            logoutBtn.addEventListener('click', async () => {
                await supabaseClient.auth.signOut();
                window.location.href = '/login';
            });
        }
    });
</script>

</body>
</html>
