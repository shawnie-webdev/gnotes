<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoldenNotes - Dashboard</title>

    <!-- Supabase JS Client via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/auth/theme.js"></script>

    <link rel="stylesheet" href="../master-combined.css">
    <style>
        .dashboard-container {
            max-width: 800px;
            margin: 0 auto;
            background-color: var(--bg-card);
            padding: 30px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-md);
        }

        .dashboard-container > .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            border-bottom: 1px solid var(--subtle-line);
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        .user-info {
            background-color: var(--secondary-navy);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            margin-bottom: 25px;
        }

        .user-info p {
            margin-bottom: 10px;
            color: var(--secondary-text);
            font-size: 16px;
            font-weight: 500;
        }

        .user-info span {
            color: var(--main-text);
            font-weight: bold;
        }

        #display-id {
            font-size: 12px;
            color: var(--muted-text) !important;
            word-break: break-all;
        }

        .logout-btn {
            background-color: var(--danger) !important;
            color: #fff !important;
            border-color: var(--danger) !important;
        }

        .logout-btn:hover {
            filter: brightness(0.92);
        }

        .dashboard-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 20px;
        }

        /* Styling for search result cards */
        .user-card-item {
            cursor: pointer;
            margin-top: 15px;
            padding: 15px 20px;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            text-align: left;
        }

        .user-card-item:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md, 0 4px 12px rgba(0,0,0,0.15));
        }

        .user-card-item h3 {
            margin: 0 0 5px 0;
            color: var(--main-text);
            font-size: 16px;
        }

        .user-card-item p {
            margin: 0;
            color: var(--muted-text);
            font-size: 13px;
        }
    </style>
</head>
<body>

<header class="top-header">
    <div class="nav-actions">
        <div class="header-left">
            <img src="../favicon.jpeg" alt="logo" id="logo">
        </div>
        <a href="/credits.html" class="btn btn-primary" id="credits">Credits</a>
        <a href="/" class="btn btn-secondary" id="dashboard">Homepage</a>
        <a href="/man-page/index.html" class="btn btn-secondary">Manual</a>
        <a href="/mod-page/index.html" class="btn btn-secondary">Mods</a>
        <div class="dropdown">
            <button class="dropbtn btn btn-secondary">Study</button>
            <div class="dropdown-content">
                <a href="/corkboard" class="btn btn-secondary" id="cb">Corkboard</a>
                <a href="/study" class="btn btn-secondary" id="study">Study Guides</a>
                <a href="/documents" class="btn btn-secondary" id="documents">Documents</a>
                <a href="/calendar" class="btn btn-secondary" id="calendar">Calendar</a>
            </div>
        </div>

        <a href="/dashboard/settings" class="btn btn-secondary" id="settings-nav">Settings</a>
        <a href="/dashboard" class="btn btn-secondary" id="d-nav">Dashboard</a>
    </div>
</header>

<div style="min-height: 50px;"><br></div>
<!-- spacer -->

<div class="dashboard-container">
    <div class="header">
        <h2>Dashboard</h2>
        <button id="logout-btn" class="btn btn-secondary logout-btn">Log Out</button>
    </div>

    <div class="user-info">
        <p>Username: <span id="display-username">Loading...</span></p>
        <p>Email: <span id="display-email">Loading...</span></p>
        <p>User ID (UUID): <span id="display-id" style="font-size: 12px; color: #64748b;">Loading...</span></p>
    </div>

    <div class="dashboard-actions">
        <a href="/dashboard/settings" class="btn btn-primary">Open Settings</a>
    </div>

    <h1><br></h1>
    <div class="card">
        <h2>Search for users (SMC Email)</h2>
        <button class="btn btn-secondary" id="redirect">View all users</button>
        <div class="solid-divider-subtle"></div>
        <form action="/dashboard" method="GET">
            <input name="search" placeholder="firstname.familyname@smc.pshs.edu.ph or name keyword" type="text" id="search-input" class="form-input">
        </form>

        <div id="usersec" class="centerx" style="width: 80%; margin: 20px auto 0 auto;">
            <!-- User cards render here -->
        </div>

    </div>

    <div class="card">
        <h2>Admin</h2>
        <a href="/auth/admin/admin-dashboard.html" class="btn btn-secondary">Dashboard</a>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://cqxlnmvmfkylozcdffxf.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNxeGxubXZtZmt5bG96Y2RmZnhmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg3NDc4OTMsImV4cCI6MjEwNDMyMzg5M30.mpxEjcWdD9Vy0WsHRL7O8n1fWfnKInsBmOgaYsiv_38';

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function search(query) {
        const searchbar = document.getElementById('search-input');
        const usersec = document.getElementById('usersec');
        if (searchbar) searchbar.value = query;

        usersec.innerHTML = '<p style="margin-top:15px; color: var(--muted-text);">Searching...</p>';

        try {
            // Fetch users from Express backend
            const response = await fetch(`/auth/searchusers?query=${encodeURIComponent(query)}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' }
            });

            const result = await response.json();

            if (!response.ok) {
                throw new Error(result.error || 'Failed to search users');
            }

            usersec.innerHTML = '';

            if (!result.users || result.users.length === 0) {
                usersec.innerHTML = '<p style="margin-top:15px; color: var(--muted-text);">No users found matching query.</p>';
                return;
            }

            // Render each matching user inside a .card container
            result.users.forEach(user => {
                const userCard = document.createElement('div');
                userCard.className = 'card user-card-item';

                const username = user.user_metadata?.username || user.email.split('@')[0];

                userCard.innerHTML = `
                    <h3>${username}</h3>
                    <p>${user.email}</p>
                `;

                // Redirect on click to /dashboard/view/user?id=UUID
                userCard.addEventListener('click', () => {
                    window.location.href = `/dashboard/view/user?id=${encodeURIComponent(user.id)}`;
                });

                usersec.appendChild(userCard);
            });

        } catch (err) {
            console.error('Search error:', err);
            usersec.innerHTML = `<p style="margin-top:15px; color: var(--danger);">Error: ${err.message}</p>`;
        }
    }

    document.addEventListener('DOMContentLoaded', async () => {
        const usernameEl = document.getElementById('display-username');
        const emailEl = document.getElementById('display-email');
        const idEl = document.getElementById('display-id');
        const logoutBtn = document.getElementById('logout-btn');

        document.getElementById("redirect").addEventListener('click', () => {
            window.location.href = "/dashboard?search=@";
        })

        async function loadUserProfile() {
            const { data: { session }, error } = await supabaseClient.auth.getSession();

            if (error || !session) {
                console.warn('No active session found.');
                window.location.href = '/login';
                return;
            }

            const user = session.user;

            if (emailEl) emailEl.textContent = user.email;
            if (idEl) idEl.textContent = user.id;
            if (usernameEl) usernameEl.textContent = user.user_metadata?.username || 'No username set';
        }

        await loadUserProfile();

        supabaseClient.auth.onAuthStateChange((event, session) => {
            if (event === 'SIGNED_OUT' || !session) {
                window.location.href = '/login';
            }
        });

        if (logoutBtn) {
            logoutBtn.addEventListener('click', async () => {
                await supabaseClient.auth.signOut();
                window.location.href = '/login';
            });
        }

        // Trigger search if "search" query parameter exists in URL
        const urlp = new URLSearchParams(window.location.search);
        const searchQuery = urlp.get('search');
        if (searchQuery && searchQuery.trim() !== '') {
            search(searchQuery.trim());
        }

        document.getElementById('adminBtn').addEventListener('click', async () => {
            try {
                // 1. Get the current active session from Supabase client
                const { data: { session }, error } = await supabaseClient.auth.getSession();

                if (error || !session) {
                    alert('No active session found. Please log in first.');
                    window.location.href = '/login';
                    return;
                }

                // 2. Set the access token into a cookie named 'token'
                // path=/ makes it available to all routes, max-age sets it for 1 day (86400 seconds)
                document.cookie = `token=${session.access_token}; path=/; max-age=86400; SameSite=Lax`;

                // 3. Redirect to your admin dashboard route
                window.location.href = '/admin-dashboard.html';

            } catch (err) {
                console.error('Error redirecting to admin:', err);
            }
        });
    });
</script>

</body>
</html>
