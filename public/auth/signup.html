<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoldenNotes - Google OAuth Sign Up</title>

    <!-- Supabase JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b111e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #ffffff;
        }

        .auth-card {
            background-color: #151f32;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 400px;
            border: 1px solid #1e2d4a;
            text-align: center;
        }

        .auth-card h2 {
            font-size: 26px;
            margin-bottom: 10px;
        }

        .auth-card p {
            color: #8da2c0;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .google-btn {
            width: 100%;
            padding: 12px 16px;
            background-color: #ffffff;
            color: #1f2937;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: background-color 0.2s, transform 0.1s;
        }

        .google-btn:hover {
            background-color: #f3f4f6;
        }

        .google-btn:active {
            transform: scale(0.98);
        }

        .status-msg {
            margin-top: 20px;
            padding: 10px;
            border-radius: 6px;
            font-size: 14px;
            display: none;
        }

        .status-msg.error {
            background-color: rgba(239, 68, 68, 0.2);
            color: #f87171;
            border: 1px solid #ef4444;
            display: block;
        }

        .status-msg.info {
            background-color: rgba(59, 130, 246, 0.2);
            color: #60a5fa;
            border: 1px solid #3b82f6;
            display: block;
        }
    </style>
</head>
<body>

<div class="auth-card">
    <h2>Welcome to GoldenNotes</h2>
    <p>Sign up or log in using your Google account to manage your documents.</p>

    <div id="statusMsg" class="status-msg"></div>

    <button id="googleSignUpBtn" class="google-btn">
        <svg width="20" height="20" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        Continue with Google
    </button>
</div>

<script>
    // 1. Initialize Supabase Client
    const SUPABASE_URL = 'https://cqxlnmvmfkylozcdffxf.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNxeGxubXZtZmt5bG96Y2RmZnhmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg3NDc4OTMsImV4cCI6MjEwNDMyMzg5M30.mpxEjcWdD9Vy0WsHRL7O8n1fWfnKInsBmOgaYsiv_38';

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const statusMsg = document.getElementById('statusMsg');
    const googleBtn = document.getElementById('googleSignUpBtn');

    function showStatus(text, type = 'info') {
        statusMsg.textContent = text;
        statusMsg.className = `status-msg ${type}`;
    }

    // 2. Handle Google Sign Up / Sign In Trigger
    googleBtn.addEventListener('click', async () => {
        showStatus("Redirecting to Google...", "info");

        // Target redirect path after successful OAuth return
        const targetRedirect = window.location.origin + '/dashboard';

        const { data, error } = await supabaseClient.auth.signInWithOAuth({
            provider: 'google',
            options: {
                redirectTo: targetRedirect
            }
        });

        if (error) {
            console.error("OAuth Error:", error);
            showStatus("Login failed: " + error.message, "error");
        }
    });

    // 3. Auto-Check Active Session on Page Load (Handles redirect back from OAuth)
    async function checkExistingSession() {
        const { data: { session }, error } = await supabaseClient.auth.getSession();

        if (session) {
            showStatus("Authenticated! Redirecting to dashboard...", "info");
            setTimeout(() => {
                window.location.href = '/dashboard';
            }, 800);
        }
    }

    // Listen for Auth changes (triggers when OAuth redirect completes)
    supabaseClient.auth.onAuthStateChange((event, session) => {
        if (event === 'SIGNED_IN' && session) {
            showStatus("Account created/verified! Redirecting to dashboard...", "info");
            window.location.href = '/dashboard';
        }
    });

    // Run check on initial load
    document.addEventListener('DOMContentLoaded', checkExistingSession);
</script>

</body>
</html>
