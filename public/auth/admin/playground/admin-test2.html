<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GoldenNotes v1.2</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">

  <!-- Supabase JS Client via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/auth/config.js"></script>
  <script src="/auth/theme.js"></script>
  <script src="/auth/theme-experimental.js"></script>
  <link rel="stylesheet" href="/master-combined.css">
  <link rel="stylesheet" href="/master-experimental.css">

  <style>
    :root {
  --rgb-red: #ff3366;
  --rgb-green: #33ff66;
  --rgb-blue: #3366ff;
  --bg-dark: #0a0b10;
}

body {
  margin: 0;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  font-family: 'Segoe UI', system-ui, sans-serif;
}

body.dark-liquid-glass {
  background-color: #050609 !important;
  background-image:
    radial-gradient(ellipse at 50% 38%, rgba(47, 76, 125, 0.13), transparent 68%),
    linear-gradient(135deg, #050609 0%, #252933 54%, #090b11 100%) !important;
}

body.dark-liquid-glass::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background-image:
    linear-gradient(rgba(235, 243, 255, 0.19) 1px, transparent 1px),
    linear-gradient(90deg, rgba(235, 243, 255, 0.19) 1px, transparent 1px);
  background-size: 64px 64px;
  filter: drop-shadow(0 0 3px rgba(210, 230, 255, 0.38));
}

body > main {
  position: relative;
  z-index: 1;
}

/* Container for Absolute Tree Layout */
.mindmap-container {
  position: relative;
  width: 600px;
  height: 600px;
  transform-origin: center;
  will-change: transform;
}

.mindmap-controls {
  position: fixed;
  bottom: 24px;
  left: 50%;
  z-index: 20;
  display: flex;
  gap: 8px;
  transform: translateX(-50%);
}

.mindmap-controls input,
.mindmap-controls button {
  min-height: 42px;
  padding: 0 14px;
  border: 1px solid rgba(255, 255, 255, 0.35);
  border-radius: 8px;
  color: #fff;
  background: #171923;
  font: inherit;
}

.mindmap-controls input { width: 220px; }
.mindmap-controls button { cursor: pointer; }
.mindmap-controls button:hover { background: #282c3a; }

.theme-toggle {
  position: fixed;
  top: 20px;
  right: 20px;
  z-index: 20;
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 10px 14px;
  border: 1px solid rgba(255, 255, 255, 0.3);
  border-radius: 8px;
  color: #fff;
  background: rgba(23, 25, 35, 0.75);
  backdrop-filter: blur(12px);
  font-size: 0.9rem;
  cursor: pointer;
}

.theme-toggle input { accent-color: #8ebcff; }

/* Base Node Styling & Performance Tuning */
.mindmap-node {
  position: absolute;
  display: flex;
  justify-content: center;
  align-items: center;
  border-radius: 50%;
  color: #fff;
  font-weight: bold;
  text-transform: uppercase;
  letter-spacing: 1px;
  cursor: pointer;
  box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
  
  /* GPU Acceleration Hints */
  will-change: transform, box-shadow;
  transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1), 
              box-shadow 0.4s ease, 
              border-color 0.4s ease;
}

/* 1. Ambient Floating Movement */
@keyframes floatAmbient {
  0% { transform: translate(0, 0); }
  33% { transform: translate(6px, -8px); }
  66% { transform: translate(-5px, 5px); }
  100% { transform: translate(0, 0); }
}

/* Node Positioning & RGB Glow Profiles */
.central-node {
  width: 120px;
  height: 120px;
  top: calc(50% - 60px);
  left: calc(50% - 60px);
  background: rgba(255, 255, 255, 0.05);
  border: 3px solid #fff;
  box-shadow: 0 0 30px rgba(255, 255, 255, 0.3), inset 0 0 15px rgba(255, 255, 255, 0.2);
  animation: floatAmbient 7s ease-in-out infinite;
  z-index: 10;
}

.child-node {
  width: 90px;
  height: 90px;
  box-sizing: border-box;
  background: rgba(0, 0, 0, 0.6);
  font-size: 0.8rem;
  text-align: center;
  padding: 8px;
  border: 2px solid var(--node-color, var(--rgb-red));
  box-shadow: 0 0 20px rgba(255, 255, 255, 0.12);
  animation: floatAmbient 7s ease-in-out infinite;
}

/* 2. Dynamic Hover Size Growth & Intense RGB Explosion */
.central-node:hover {
  transform: scale(1.25); /* CSS transforms preserve performance */
  box-shadow: 0 0 50px rgba(255, 255, 255, 0.8), inset 0 0 25px rgba(255, 255, 255, 0.5);
  animation-play-state: paused; /* Locks position while interacting */
}

.child-node:hover {
  transform: scale(1.3);
  box-shadow: 0 0 40px var(--node-color, var(--rgb-red)), 0 0 15px var(--node-color, var(--rgb-red)) inset;
  background: rgba(255, 255, 255, 0.1);
  animation-play-state: paused;
}

.branch-lines {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  overflow: visible;
  z-index: 1;
}
.branch-lines line { stroke: rgba(255, 255, 255, 0.35); stroke-width: 2; }

  </style>
</head>
<body class="dark-liquid-glass">


<main>
<div class="mindmap-container">
  <!-- Central Node -->
  <div class="mindmap-node central-node">
    <span>SELECTION</span>
  </div>

  <svg class="branch-lines" viewBox="0 0 600 600" aria-hidden="true"></svg>
</div>
<form class="mindmap-controls" id="add-node-form">
  <input id="new-node-label" type="text" maxlength="30" placeholder="New node name" aria-label="New node name" required>
  <button type="submit">Add node</button>
</form>
<label class="theme-toggle">
  <input id="dark-glass-toggle" type="checkbox" checked>
  <span>Dark glass override</span>
</label>
</main>

<script>
(() => {
  const mindmap = document.querySelector('.mindmap-container');
  if (!mindmap) return;
  const centralLabel = mindmap.querySelector('.central-node > span');
  const branches = mindmap.querySelector('.branch-lines');
  const form = document.querySelector('#add-node-form');
  const input = document.querySelector('#new-node-label');
  const darkGlassToggle = document.querySelector('#dark-glass-toggle');
  const colors = ['#ff3366', '#33ff66', '#3366ff', '#ffd633', '#d633ff', '#33ddff'];
  const branchNodes = [];

  try {
    const savedPreference = localStorage.getItem('gn-dark-liquid-glass');
    darkGlassToggle.checked = savedPreference === null || savedPreference === 'true';
  } catch (_) {
    darkGlassToggle.checked = true;
  }
  document.body.classList.toggle('dark-liquid-glass', darkGlassToggle.checked);
  darkGlassToggle.addEventListener('change', () => {
    document.body.classList.toggle('dark-liquid-glass', darkGlassToggle.checked);
    try {
      localStorage.setItem('gn-dark-liquid-glass', String(darkGlassToggle.checked));
    } catch (_) { /* ignore unavailable storage */ }
  });

  function arrangeNodes() {
    const center = 300;
    const radius = 215;
    const nodeSize = 90;
    const count = branchNodes.length;

    branchNodes.forEach(({ node, line }, index) => {
      const radians = -Math.PI / 2 + (2 * Math.PI * index) / count;
      const x = center + Math.cos(radians) * radius;
      const y = center + Math.sin(radians) * radius;
      node.style.left = `${x - nodeSize / 2}px`;
      node.style.top = `${y - nodeSize / 2}px`;
      line.setAttribute('x1', center);
      line.setAttribute('y1', center);
      line.setAttribute('x2', center + Math.cos(radians) * (radius - nodeSize / 2));
      line.setAttribute('y2', center + Math.sin(radians) * (radius - nodeSize / 2));
    });
  }

  form.addEventListener('submit', event => {
    event.preventDefault();
    const labelText = input.value.trim();
    if (!labelText) return;

    const node = document.createElement('div');
    node.className = 'mindmap-node child-node';
    node.style.setProperty('--node-color', colors[branchNodes.length % colors.length]);
    const label = document.createElement('span');
    label.textContent = labelText;
    node.append(label);
    mindmap.append(node);

    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    branches.append(line);
    branchNodes.push({ node, label, line });
    input.value = '';
    arrangeNodes();
    input.focus();
  });

  const degreesPerSecond = 15; 
  const response = 1.6;
  const pauseThreshold = 0.02;
  let hovered = false;
  let angle = 0;
  let speed = degreesPerSecond;
  let previousTime;

  mindmap.addEventListener('pointerenter', () => { hovered = true; });
  mindmap.addEventListener('pointerleave', () => { hovered = false; });

  function rotateMindmap(time) {
    if (previousTime !== undefined) {
      const deltaSeconds = Math.min((time - previousTime) / 1000, 0.05);
      const targetSpeed = hovered ? 0 : degreesPerSecond;
      speed += (targetSpeed - speed) * Math.min(1, response * deltaSeconds);

      if (hovered && speed < pauseThreshold) speed = 0;
      angle = (angle + speed * deltaSeconds) % 360;
      mindmap.style.transform = `rotate(${angle}deg)`;
      centralLabel.style.transform = `rotate(${-angle}deg)`;
      branchNodes.forEach(({ label }) => {
        label.style.transform = `rotate(${-angle}deg)`;
      });
    }

    previousTime = time;
    requestAnimationFrame(rotateMindmap);
  }

  requestAnimationFrame(rotateMindmap);
})();
</script>
</body>
</html>
