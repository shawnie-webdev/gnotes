<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GoldenNotes v1.2</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">

  <!-- Supabase JS Client via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/auth/config.js"></script>
  <script src="/auth/theme.js"></script>
  <script src="/auth/theme-experimental.js"></script>
  <link rel="stylesheet" href="../../master-combined.css">
  <link rel="stylesheet" href="../../master-experimental.css">
  <link rel="stylesheet" href="style.css">

</head>
<body>

<header class="top-header">
  <div class="nav-actions">
    <div class="header-left">
      <img src="/favicon.jpeg" alt="logo" id="logo">
    </div>
    <a href="/credits.html" class="btn btn-primary" id="credits">Credits</a>
    <a href="/" class="btn btn-secondary" id="dashboard">Homepage</a>
    <a href="/man-page/index.html" class="btn btn-secondary">Manual</a>
    <div class="dropdown btn btn-secondary">
      Study
      <div class="dropdown-content">
        <a href="/corkboard" class="btn btn-secondary" id="cb">Corkboard</a>
        <a href="/study" class="btn btn-secondary" id="study">Study Guides</a>
        <a href="/documents" class="btn btn-secondary" id="documents">Documents</a>
        <a href="/calendar" class="btn btn-secondary" id="calendar">Calendar</a>
        <a href="/quiz" class="btn btn-secondary" id="calendar">Quiz</a>
  
      </div>
    </div>

    <a href="/dashboard/settings" class="btn btn-secondary" id="settings-nav">Settings</a>
    <a href="/dashboard" class="btn btn-secondary" id="d-nav">Dashboard</a>
  </div>
</header>

<main>
    <div class="side-panel">
        <h1>OBJECTS</h1>
        <button class="square-button" id="button">
        <span><strong>Normal Button (Primary Button)</strong></span>
        <img src="images/Button.png" alt="Primary Golden Button" width="158" height="68" class="img">
        </button>

        <button class="square-button" id="button">
        <span><strong>Normal Button (Secondary Button)</strong></span>
        <img src="images/Button2.png" alt="Secondary  Button" width="120" height="64" class="img">
        </button>

        <button class="square-button" id="card">
        <span><strong>Normal Card</strong></span>
        <img src="images/Card.png" alt="Primary Card" width="126" height="92" class="img">
        </button>

        <button class="square-button" id="dropdown">
        <span><strong>Normal Dropdown</strong></span>
        <img src="images/Dropdown.png" alt="Primary Dropdown" width="92" height="125" class="img">
        </button>

        <button class="square-button" id="badge">
        <span><strong>Badge</strong></span>
        <img src="/betatester.png" alt="Badge" width="100" height="100" class="img">
        </button>

        <button class="square-button" id="lists">
        <span><strong>Lists</strong></span>
        <img src="images/list.png" alt="Lists" width="106" height="85" class="img">
        </button>

         <button class="square-button" id="function">
        <span><strong>Insert Function</strong></span>
        <select class="form-select">
          <option id="SupabaseRetrieveTable">Supabase Table Retriever</option>
          <option id="SupabaseInsertRow">Insert Row in Table</option>
          <option id="SupabaseDeleteRow">Delete Row in Table</option>
          <option id="RetrieveUserInfo">Retrieve User's Info</option>
        </select>
      </button>
    </div>

    <div class="side_panel_2">
      <h2>Remote Device Controls</h2>
      <button class="square-button" id="connect-device">Connect to a Device</button>
      <button class="square-button" id="abort-device">Abort the Device</button>
      <button class="square-button" id="device-controls">Create Device Controls</button>
    </div>
</main>

<script>

</script>
</body>
</html>
