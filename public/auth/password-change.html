<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Change temporary password | GoldenNotes</title>
<link rel="stylesheet" href="../master-combined.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="theme.js"></script>
<style>
body{min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg-main,#0d1117);color:var(--main-text,#e6edf3)}
main{width:min(100%,460px);padding:28px;border:1px solid var(--border-color,#30363d);border-radius:14px;background:var(--bg-card,#161b22)}
label{display:block;margin-top:16px}input{width:100%;padding:12px;margin-top:6px;border-radius:8px;border:1px solid var(--border-color,#444);background:var(--bg-main,#0d1117);color:inherit;font:inherit}
button{width:100%;margin-top:20px;padding:12px;border:0;border-radius:8px;background:#f97316;color:white;font-weight:700;cursor:pointer}#status{margin-top:14px}
</style></head>
<body><main><h1>Choose a new password</h1><p>Your account was given a temporary password by a developer. Choose a new password before continuing.</p>
<form id="form"><label for="password">New password</label><input id="password" type="password" autocomplete="new-password" minlength="10" required><label for="confirm">Confirm new password</label><input id="confirm" type="password" autocomplete="new-password" minlength="10" required><button id="save" type="submit">Update password</button></form><p id="status" role="status"></p></main>
<script>
(async()=>{
 const client=window.GoldenNotesTheme?.getClient?.()||window.supabase.createClient('https://cqxlnmvmfkylozcdffxf.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyZWYiOiJjcXhsbm12bWZreWxvemNkZmZ4ZiIsInJvbGUiOiJhbm9uIiwiaWF0IjoxNzg4NzQ3ODkzLCJleHAiOjIxMDQzMjM4OTN9.mpxEjcWdD9Vy0WsHRL7O8n1fWfnKInsBmOgaYsiv_38');
 const status=document.getElementById('status'),form=document.getElementById('form'),save=document.getElementById('save');
 const {data,error}=await client.auth.getUser();
 if(error||!data?.user){location.replace('/login');return}
 if(!data.user.user_metadata?.password_reset_required){location.replace('/dashboard');return}
 form.addEventListener('submit',async e=>{
  e.preventDefault();const p=document.getElementById('password').value,c=document.getElementById('confirm').value;
  if(p.length<10){status.textContent='Use at least 10 characters.';return}
  if(p!==c){status.textContent='Passwords do not match.';return}
  save.disabled=true;
  try{
   // Supabase JS updateUser expects user metadata under `data`, not `user_metadata`.
   // The old property was ignored, so the temporary-password flag stayed true and users
   // were sent straight back to this page after changing their password.
   const {data:updated,error:updateError}=await client.auth.updateUser({
    password:p,
    data:{...(data.user.user_metadata||{}),password_reset_required:false}
   });
   if(updateError)throw updateError;
   status.textContent='Password updated. Redirecting…';
   alert('Your password has been changed successfully.');
   location.replace(updated?.user?.phone_confirmed_at?'/dashboard':'/auth/phone-setup.html');
  }catch(err){status.textContent='Could not update password: '+err.message}
  finally{save.disabled=false}
 });
})();
</script></body></html>
