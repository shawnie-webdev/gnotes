<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GNotes Developer Terminal</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0d1117;
            color: #58a6ff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .terminal-container {
            width: 100%;
            max-width: 800px;
            height: 500px;
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .terminal-header {
            background-color: #21262d;
            padding: 10px 15px;
            border-bottom: 1px solid #30363d;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
        }
        .btn-close { background-color: #ff5f56; }
        .btn-min { background-color: #ffbd2e; }
        .btn-max { background-color: #27c93f; }

        .terminal-title {
            color: #8b949e;
            font-size: 0.85rem;
            margin-left: auto;
            margin-right: auto;
        }

        .terminal-output {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-size: 0.95rem;
        }

        .line {
            line-height: 1.4;
            word-break: break-all;
            white-space: pre-wrap;
        }

        .line.system { color: #8b949e; }
        .line.user { color: #e6edf3; }
        .line.success { color: #3fb950; }
        .line.error { color: #f85149; }

        .terminal-input-row {
            display: flex;
            padding: 12px 15px;
            background-color: #0d1117;
            border-top: 1px solid #30363d;
            align-items: center;
        }

        .prompt {
            color: #2f81f7;
            font-weight: bold;
            margin-right: 10px;
        }

        #command-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #e6edf3;
            font-family: inherit;
            font-size: 0.95rem;
        }

        #command-input:disabled {
            cursor: not-allowed;
            opacity: 0.5;
        }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://cqxlnmvmfkylozcdffxf.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNxeGxubXZtZmt5bG96Y2RmZnhmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg3NDc4OTMsImV4cCI6MjEwNDMyMzg5M30.mpxEjcWdD9Vy0WsHRL7O8n1fWfnKInsBmOgaYsiv_38';

        // Declare globally so both DOMContentLoaded and submit listeners can see it
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        document.addEventListener("DOMContentLoaded", async () => {
            const ALLOWED_UUIDS = [
                "cf495833-c543-4d38-aa7d-29f8862fab4f",
                "c6e6cfb2-d5fe-4272-ba38-6ad47dd830b9",
                "cf1da5cf-073c-475c-a5f1-d92ff991b2d4"
            ];

            const { data: { session } } = await supabase.auth.getSession();

            if (!session) {
                alert("Access restricted. Please log in first.");
                window.location.replace("/login");
                return;
            }

            const userId = session.user.id;
            if (!ALLOWED_UUIDS.includes(userId)) {
                alert("Forbidden: Your account does not have developer privileges.");
                window.location.replace("/dashboard");
                return;
            }

            console.log("Access granted for user:", userId);
        });
    </script>
</head>
<body>

<div class="terminal-container">
    <div class="terminal-header">
        <span class="btn btn-close"></span>
        <span class="btn btn-min"></span>
        <span class="btn btn-max"></span>
        <span class="terminal-title">developers/post - bash</span>
    </div>

    <div class="terminal-output" id="output">
        <div class="line system">GoldenNotes Dev Terminal [Version 1.0.0]</div>
        <div class="line system">Connected target: https://gnotes-ide4.onrender.com/developers/post</div>
        <div class="line system">Type a command or payload and press Enter.</div>
        <div class="line system">--------------------------------------------------</div>
    </div>

    <form class="terminal-input-row" id="terminal-form">
        <span class="prompt">dev@gnotes:~$</span>
        <input type="text" id="command-input" autocomplete="off" autofocus placeholder="Type command...">
    </form>
</div>

<script>
    const TARGET_URL = 'https://gnotes-ide4.onrender.com/developers/post';
    const outputEl = document.getElementById('output');
    const inputEl = document.getElementById('command-input');
    const formEl = document.getElementById('terminal-form');

    function appendLine(text, type = 'system') {
        const line = document.createElement('div');
        line.className = `line ${type}`;
        line.textContent = text;
        outputEl.appendChild(line);
        outputEl.scrollTop = outputEl.scrollHeight;
    }

    formEl.addEventListener('submit', async (e) => {
        e.preventDefault();

        const command = inputEl.value.trim();
        if (!command) return;

        appendLine(`dev@gnotes:~$ ${command}`, 'user');
        inputEl.value = '';
        inputEl.disabled = true;

        try {
            const { data, error: sessionError } = await supabase.auth.getSession();

            if (sessionError || !data || !data.session) {
                appendLine('[Authentication Error]: No active Supabase session found. Please log in first.', 'error');
                return;
            }

            const session = data.session;

            const response = await fetch(TARGET_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${session.access_token}`
                },
                body: JSON.stringify({ command: command })
            });

            const contentType = response.headers.get("content-type");
            let responseData;

            if (contentType && contentType.includes("application/json")) {
                const json = await response.json();
                responseData = json.output || JSON.stringify(json, null, 2);
            } else {
                responseData = await response.text();
            }

            if (response.ok) {
                appendLine(responseData, 'success');
            } else {
                appendLine(`[${response.status}] ${responseData}`, 'error');
            }
        } catch (err) {
            appendLine(`[Error]: ${err.message}`, 'error');
        } finally {
            inputEl.disabled = false;
            inputEl.focus();
        }
    });

    outputEl.addEventListener('click', () => inputEl.focus());
</script>

</body>
</html>
