<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project GoldenNotes</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">

    <!-- Supabase JS Client via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="master.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Hero Content */
        .hero-container {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            width: 90%;
            max-width: 800px;
        }
    </style>
</head>
<body>

<header class="top-header">
    <div class="header-left">
        <img src="favicon.jpeg" alt="logo" id="logo">
    </div>

    <div class="nav-actions">
        <form action="./credits.html" method="get" style="display: inline;">
            <button type="submit" class="generic_button" id="credits">Credits</button>
        </form>
        <form action="./auth/dashboard.html" method="get" style="display: inline;">
            <button type="submit" class="generic_button" id="dashboard">Dashboard</button>
        </form>
        <button class="generic_button primary" id="login">Login</button>
    </div>
</header>

<main class="hero-container">
    <h1 id="header" class="big-font">Project GoldenNotes (ALPHA 1.105)</h1>
    <h3> Added Advanced Topics section (WIP)</h3>
    <h2 id="splashtext">A project by Ram</h2>
</main>

<script>
    // Supabase Credentials
    const SUPABASE_URL = 'https://cqxlnmvmfkylozcdffxf.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNxeGxubXZtZmt5bG96Y2RmZnhmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg3NDc4OTMsImV4cCI6MjEwNDMyMzg5M30.mpxEjcWdD9Vy0WsHRL7O8n1fWfnKInsBmOgaYsiv_38';

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Check Auth State on DOM Content Loaded
    document.addEventListener('DOMContentLoaded', async () => {
        const loginBtn = document.getElementById("login");

        // Fetch session from Supabase client
        const { data: { session } } = await supabaseClient.auth.getSession();

        if (session) {
            const user = session.user;

            // Access the username from user_metadata
            const username = user.user_metadata?.username || "User";

            const loginBtn = document.getElementById("login");
            loginBtn.innerText = `Hi, ${username}!`;
        } else {
            // User is not signed in
            loginBtn.innerText = "Login";
            loginBtn.addEventListener("click", () => {
                window.location.href = "./login.html";
            });
        }

        // Listen for Auth changes in real-time
        supabaseClient.auth.onAuthStateChange((event, session) => {
            if (session) {
                loginBtn.innerText = "Hi there!";
            } else {
                loginBtn.innerText = "Login";
            }
        });
    });

    /* Lower Text randomizer */
    const splashtxt = [
        "PROJECT INITIATED // Starting...",
        "Welcome to Project GoldenNotes!",
        "A place where you can save notes.",
        "Hi!",
        "This sounds like it's from Minecraft.",
        "'That one.'",
        "Is anyone even reading these things?",
        "Insert splash text here.",
        "Version v1.1?",
        "Try reading something on the Study section.",
        "The Advanced Topics section are still in the works.",
        "Developers: Roshaun, Ram, Jess",
        "I feel very british today, should I add an accent to my voice?",
        "Project GoldenNotes is a project started by Ram to give accessible information to Batch 32.",
        "Pi equals around 3.141592653589...",
        "Do you have an alpilar?",
        "Advanced topics cover these subjects but not limited to Quantum Physics, Astrological Physics, Nuclear Physics, Chemistry, Biology... etc...",
        "Ram is a really funny Batch Governor. He once threw an entire atom at the whole class.",
        "Huh. Wonder why the code isn't working for some reason.",
        "Roshaun is one of the backend developers of GoldenNotes.",
        "Jess is the designer and he added the Advanced Topics section, along with fixing some things. As well as this splash text.",
        "There's so many ILAs...",
        "Life is miserable.. So many assessments!"
    ];

    const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
    const splash = document.getElementById("splashtext");

    async function typewriter(next) {
        let text = splash.innerText;

        // 1. Smoothly delete current text from end to start
        while (text.length > 0) {
            text = text.slice(0, -1);
            splash.innerText = '"'+text + '"|';
            await sleep(25);
        }

        await sleep(200);

        // 2. Type out the new text character by character
        for (let i = 0; i < next.length; i++) {
            text += next[i];
            splash.innerText = text + '|';
            await sleep(75);
        }
    }

    async function main() {
        while (true) {
            const ran = Math.floor(Math.random() * splashtxt.length);
            const nxt = splashtxt[ran];

            await typewriter(nxt);
            await sleep(2500);
        }
    }

    main();
</script>
</body>
</html>
