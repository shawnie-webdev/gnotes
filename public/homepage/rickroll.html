<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fullscreen Video</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            cursor: none; /* Hides cursor over the video */
        }

        video {
            width: 100vw;
            height: 100vh;
            object-fit: cover; /* Ensures video fills screen completely without stretching */
            position: absolute;
            top: 0;
            left: 0;
            border: none;
            outline: none;
        }
    </style>
</head>
<body>

<!-- Video element with no controls -->
<video id="myVideo" autoplay loop muted playsinline>
    <source src="movie.mp4" type="video/mp4">
    Your browser does not support the video tag.
</video>

<script>
    const video = document.getElementById('myVideo');

    function enterFullscreen() {
        const elem = document.documentElement;
        if (elem.requestFullscreen) {
            elem.requestFullscreen().catch(() => {});
        } else if (elem.webkitRequestFullscreen) { /* Safari / Older Chrome */
            elem.webkitRequestFullscreen();
        } else if (elem.msRequestFullscreen) { /* IE11 */
            elem.msRequestFullscreen();
        }
    }

    // Try entering fullscreen immediately (works if browser permits or opened via popup)
    window.addEventListener('DOMContentLoaded', () => {
        enterFullscreen();
        video.play().catch(() => {});
    });

    // Fallback: Web browsers require user interaction to enter true native fullscreen.
    // Clicking or pressing any key anywhere on the screen triggers fullscreen immediately.
    document.addEventListener('click', enterFullscreen);
    document.addEventListener('keydown', enterFullscreen);
    document.addEventListener('touchstart', enterFullscreen);
</script>

</body>
</html>
