<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Make a Quiz · GoldenNotes</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/auth/config.js"></script><script src="/auth/theme.js"></script><style>
:root{color-scheme:dark;--bg:#101713;--panel:#18231c;--line:#2d4434;--accent:#70e08b;--text:#e8f3e9;--muted:#a7b8aa}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px system-ui,sans-serif}main{max-width:950px;margin:32px auto;padding:20px}h1{color:var(--accent)}a{color:var(--accent)}.panel,.question,.quiz-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin:14px 0}input,textarea,select{width:100%;padding:11px;border-radius:8px;border:1px solid var(--line);background:#0c120e;color:var(--text);margin:6px 0 12px}button,.button{display:inline-block;background:var(--accent);color:#102015;font-weight:700;border:0;border-radius:9px;padding:11px 16px;cursor:pointer;text-decoration:none;margin:4px}button.secondary{background:#26382b;color:var(--text)}label{display:block;color:var(--muted)}.muted{color:var(--muted)}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:180px}.error{color:#ff9a9a}.success{color:var(--accent)}.option{display:flex;align-items:center;gap:8px;margin:8px 0}.option input{width:auto;margin:0}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
</style></head><body><main><div class="top"><div><h1>Quiz Builder</h1><p class="muted">Editor, Moderator, or Admin access is required to publish.</p></div><a href="/quiz">← All quizzes</a></div><form id="quizForm" class="panel"><label>Quiz title<input id="title" required maxlength="150" placeholder="e.g. Biology: Cells"></label><label>Description<textarea id="description" maxlength="2000" rows="3" placeholder="What is this quiz about?"></textarea></label><div id="questions"></div><div class="row"><button type="button" class="secondary" data-type="single">+ Multiple choice (single answer)</button><button type="button" class="secondary" data-type="multiple">+ Multiple choice (select all)</button><button type="button" class="secondary" data-type="text">+ Text input</button><button type="button" class="secondary" data-type="scale">+ Scale</button></div><p id="status" role="status" class="muted"></p><button type="submit">Publish quiz</button></form></main><script>
const list=document.querySelector('#questions'),status=document.querySelector('#status');let count=0;
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function add(type){const id=count++;const card=document.createElement('section');card.className='question';card.dataset.type=type;card.dataset.id=id;let body='<label>Question<input class="prompt" required maxlength="1000" placeholder="Write your question"></label>';
if(type==='single'||type==='multiple'){body+='<label>Answer options (one per line)<textarea class="options" required rows="4" placeholder="Option A&#10;Option B&#10;Option C"></textarea></label><label>Correct answer'+(type==='multiple'?'s (choose all correct options below)':' (type the exact option text)')+'<input class="answer" placeholder="'+(type==='multiple'?'Separate correct options with |':'Exact option text')+'" required></label>'}
if(type==='text')body+='<label>Accepted answer (optional; leave blank for manual marking)<input class="answer" placeholder="Expected answer"></label>';
if(type==='scale')body+='<div class="row"><label>Minimum<input class="min" type="number" value="1"></label><label>Maximum<input class="max" type="number" value="5"></label></div><div class="row"><label>Minimum label<input class="minLabel" placeholder="Not at all"></label><label>Maximum label<input class="maxLabel" placeholder="Very much"></label></div>';
card.innerHTML='<div class="top"><strong>Question '+(id+1)+' · '+({single:'Multiple choice',multiple:'Multiple answers',text:'Text input',scale:'Scale'}[type])+'</strong><button class="secondary remove" type="button">Remove</button></div>'+body;card.querySelector('.remove').onclick=()=>card.remove();list.append(card)}
document.querySelectorAll('[data-type]').forEach(b=>b.addEventListener('click',()=>add(b.dataset.type)));
document.querySelector('#quizForm').addEventListener('submit',async e=>{e.preventDefault();status.className='muted';status.textContent='Checking session and publishing…';try{const client=window.supabaseClient||window.GoldenNotesConfig?.initClient();if(!client)throw Error('Supabase client did not initialize.');const {data:{session},error}=await client.auth.getSession();if(error||!session)throw Error('Please sign in before publishing a quiz.');const questions=[...list.querySelectorAll('.question')].map(el=>{const type=el.dataset.type,q={type,prompt:el.querySelector('.prompt').value.trim()};if(type==='single'||type==='multiple'){q.options=el.querySelector('.options').value.split('\n').map(x=>x.trim()).filter(Boolean);const a=el.querySelector('.answer').value.split('|').map(x=>x.trim()).filter(Boolean);q.answer=type==='single'?[a[0]||''] : a;}if(type==='text')q.answer=[el.querySelector('.answer').value.trim()].filter(Boolean);if(type==='scale'){q.min=Number(el.querySelector('.min').value);q.max=Number(el.querySelector('.max').value);q.minLabel=el.querySelector('.minLabel').value;q.maxLabel=el.querySelector('.maxLabel').value;}return q});const r=await fetch('/api/quizzes',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+session.access_token},body:JSON.stringify({title:document.querySelector('#title').value,description:document.querySelector('#description').value,questions})});const d=await r.json();if(!r.ok)throw Error(d.error||'Could not publish');status.className='success';status.textContent='Quiz published! Opening it…';location.href='/quiz/answer?uuid='+encodeURIComponent(d.quiz.uuid)}catch(err){status.className='error';status.textContent=err.message}});
add('single');
</script></body></html>
