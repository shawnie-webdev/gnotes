<main>
<div id="chatbox"></div>
    <input type="text" id="userInput" placeholder="Type a message..." style="width: 75%; padding: 8px;">
    <button onclick="sendMessage()" style="padding: 8px 15px;">Send</button>
</main>
    <script>
    function appendMessage(role, text, isError = false) {
      const chatbox = document.getElementById('chatbox');
      const messageElement = document.createElement('div');
      const label = document.createElement('b');

      messageElement.className = role === 'You' ? 'user' : 'ai';
      if (isError) messageElement.style.color = 'red';
      label.textContent = `${role}:`;
      messageElement.append(label, document.createTextNode(` ${text}`));
      chatbox.appendChild(messageElement);
      chatbox.scrollTop = chatbox.scrollHeight;
    }

        async function sendMessage() {
            const inputField = document.getElementById('userInput');
            const message = inputField.value.trim();
            if (!message) return;
            if (message.length > 4000) {
              appendMessage('Error', 'Messages must be 4,000 characters or fewer.', true);
              return;
            }

      appendMessage('You', message);
            inputField.value = '';

            try {
                // Post the user's message to our secure Node.js backend
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: message })
                });

                  const data = await response.json().catch(() => ({}));
                  if (!response.ok) {
                    throw new Error(data.error || `Request failed (${response.status}).`);
                  }
                  if (typeof data.reply !== 'string' || !data.reply.trim()) {
                    throw new Error('The server returned an empty reply.');
                  }

                  appendMessage('AI', data.reply);
            } catch (error) {
                  const errorMessage = error instanceof TypeError
                    ? 'Cannot reach the chat server. Run `npm start` and open http://localhost:3000/openai/index.html.'
                    : error.message || 'Could not connect to server.';
                  appendMessage('Error', errorMessage, true);
            }
        }

        document.getElementById('userInput').addEventListener('keydown', (event) => {
          if (event.key === 'Enter' && !event.isComposing) sendMessage();
        });
    </script>
</body>
</html>
