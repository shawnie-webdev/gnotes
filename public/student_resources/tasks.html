<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tasks | GoldenNotes</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/auth/config.js"></script>
  <script src="/auth/theme.js"></script>
  <script src="/auth/theme-experimental.js"></script>
  <link rel="stylesheet" href="/master-combined.css">
  <link rel="stylesheet" href="/master-experimental.css">
  <style>
    main { width: min(100% - 2rem, 960px); margin: 2rem auto 4rem; }
    .task-layout { display: grid; grid-template-columns: minmax(240px, 0.8fr) minmax(0, 1.4fr); gap: 1.5rem; align-items: start; }
    .task-panel { padding: 1.25rem; }
    .task-panel h1, .task-panel h2 { margin-top: 0; }
    .task-form { display: grid; gap: 0.65rem; }
    .task-form label { margin-top: 0.35rem; }
    .task-form textarea { min-height: 105px; resize: vertical; }
    .task-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-bottom: 1rem; }
    .task-toolbar h2 { margin: 0; }
    .task-filter { min-width: 130px; }
    .task-list { display: grid; gap: 0.75rem; }
    .task-item { border: 1px solid var(--border-color, #59616d); border-radius: 6px; padding: 1rem; }
    .task-item.is-complete { opacity: 0.68; }
    .task-item.is-complete .task-title { text-decoration: line-through; }
    .task-item-header { display: flex; align-items: flex-start; gap: 0.75rem; }
    .task-item-header input { margin-top: 0.35rem; }
    .task-item-content { min-width: 0; flex: 1; }
    .task-title { margin: 0; overflow-wrap: anywhere; }
    .task-subject { margin: 0.25rem 0; color: var(--text-secondary, #aab2bd); font-size: 0.9rem; }
    .task-description { margin: 0.75rem 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }
    .task-delete { border: 0; background: transparent; color: var(--danger, #ef4444); cursor: pointer; font: inherit; padding: 0.25rem; }
    .task-delete:disabled, .task-item input:disabled { cursor: not-allowed; opacity: 0.6; }
    .task-message { min-height: 1.4em; }
    .task-message:empty { display: none; }
    .task-actions { display: flex; align-items: center; gap: 0.75rem; }
    .task-toggle { width: 1rem; height: 1rem; }
    @media (max-width: 680px) {
      main { width: min(100% - 1rem, 960px); margin-top: 1rem; }
      .task-layout { grid-template-columns: 1fr; gap: 1rem; }
      .task-panel { padding: 1rem; }
    }
  </style>
</head>
<body>
<header class="top-header">
  <div class="nav-actions">
    <div class="header-left">
      <img src="/favicon.jpeg" alt="logo" id="logo">
    </div>
    <a href="/credits.html" class="btn btn-primary" id="credits">Credits</a>
    <a href="/" class="btn btn-secondary" id="dashboard">Homepage</a>
    <a href="/man-page/index.html" class="btn btn-secondary">Manual</a>
    <div class="dropdown btn btn-secondary">
      Study
      <div class="dropdown-content">
        <a href="/corkboard" class="btn btn-secondary" id="cb">Corkboard</a>
        <a href="/study" class="btn btn-secondary" id="study">Study Guides</a>
        <a href="/documents" class="btn btn-secondary" id="documents">Documents</a>
        <a href="/calendar" class="btn btn-secondary" id="calendar">Calendar</a>
  
      </div>
    </div>

    <a href="/dashboard/settings" class="btn btn-secondary" id="settings-nav">Settings</a>
    <a href="/dashboard" class="btn btn-secondary" id="d-nav">Dashboard</a>
  </div>
</header>

  <main>
    <div class="task-layout">
      <section class="card task-panel" aria-labelledby="create-task-heading">
        <h1 id="create-task-heading">Add a task</h1>
        <form class="task-form" id="task-form">
          <label for="task-title">Task name</label>
          <input class="form-input" id="task-title" name="title" maxlength="150" autocomplete="off" required>
          <label for="task-description">Description</label>
          <textarea class="form-input" id="task-description" name="description" maxlength="2000"></textarea>
          <label for="task-subject">Subject</label>
          <input class="form-input" id="task-subject" name="subject" maxlength="100" required>
          <button class="submit-btn btn btn-primary" id="submitBtn" type="submit" disabled>Add task</button>
          <p class="task-message" id="task-form-status" role="status" aria-live="polite"></p>
        </form>
      </section>
    </div>

    <section class="card">
           <a href="/quiz" class="btn btn-primary btn-lg"></a>
    </section>

      <section class="card task-panel" aria-labelledby="tasks-heading">
        <div class="task-toolbar">
          <h2 id="tasks-heading">Your tasks</h2>
          <select class="form-input task-filter" id="task-filter" aria-label="Filter tasks">
            <option value="all">All</option>
            <option value="active">Active</option>
            <option value="completed">Completed</option>
          </select>
        </div>
        <p id="task-list-status" class="task-message" role="status" aria-live="polite">Loading tasks...</p>
        <div class="task-list" id="task-list"></div>
      </section>
        </div>
    </main>
    <script>
        (() => {
            const SUPABASE_URL = 'https://cqxlnmvmfkylozcdffxf.supabase.co';
            const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNxeGxubXZtZmt5bG96Y2RmZnhmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg3NDc4OTMsImV4cCI6MjEwNDMyMzg5M30.mpxEjcWdD9Vy0WsHRL7O8n1fWfnKInsBmOgaYsiv_38';
            const form = document.getElementById('task-form');
            const submitButton = document.getElementById('submitBtn');
            const list = document.getElementById('task-list');
            const listStatus = document.getElementById('task-list-status');
            const formStatus = document.getElementById('task-form-status');
            const filter = document.getElementById('task-filter');

            if (!window.supabase) {
                listStatus.textContent = 'Tasks are unavailable because Supabase failed to load.';
                return;
            }

            const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            let canWrite = false;
            let canManageTasks = false;
            let tasks = [];

            function setFormStatus(message, isError = false) {
                formStatus.textContent = message;
                formStatus.setAttribute('role', isError ? 'alert' : 'status');
            }

            function taskIsComplete(task) {
                return task.completed === true;
            }

            function renderTasks() {
                list.replaceChildren();
                const selectedFilter = filter.value;
                const visibleTasks = tasks.filter((task) => {
                    const complete = taskIsComplete(task);
                    return selectedFilter === 'all' || (selectedFilter === 'completed' ? complete : !complete);
                });

                if (visibleTasks.length === 0) {
                    listStatus.textContent = tasks.length === 0
                        ? 'No tasks yet. Add one using the form.'
                        : 'No tasks match this filter.';
                    return;
                }

                listStatus.textContent = '';
                visibleTasks.forEach((task) => {
                    const isComplete = taskIsComplete(task);
                    const item = document.createElement('article');
                    item.className = `task-item${isComplete ? ' is-complete' : ''}`;

                    const header = document.createElement('div');
                    header.className = 'task-item-header';
                    const toggle = document.createElement('input');
                    toggle.type = 'checkbox';
                    toggle.className = 'task-toggle';
                    toggle.checked = isComplete;
                    toggle.disabled = !canManageTasks;
                    toggle.setAttribute('aria-label', `${isComplete ? 'Mark' : 'Complete'} ${task.name || 'task'}`);
                    toggle.addEventListener('change', () => updateTask(task, { completed: toggle.checked }));

                    const content = document.createElement('div');
                    content.className = 'task-item-content';
                    const title = document.createElement('h3');
                    title.className = 'task-title';
                    title.textContent = task.name || 'Untitled task';
                    const subject = document.createElement('p');
                    subject.className = 'task-subject';
                    subject.textContent = typeof task.subject === 'string' ? task.subject : (task.subject?.name || 'General');
                    content.append(title, subject);

                    const actions = document.createElement('div');
                    actions.className = 'task-actions';
                    const remove = document.createElement('button');
                    remove.type = 'button';
                    remove.className = 'task-delete';
                    remove.textContent = 'Delete';
                    remove.disabled = !canManageTasks;
                    remove.setAttribute('aria-label', `Delete ${task.name || 'task'}`);
                    remove.addEventListener('click', () => deleteTask(task));
                    actions.append(remove);
                    header.append(toggle, content, actions);
                    item.append(header);

                    if (task.data) {
                        const description = document.createElement('p');
                        description.className = 'task-description';
                        description.textContent = typeof task.data === 'string' ? task.data : '';
                        item.append(description);
                    }
                    list.append(item);
                });
            }

            async function loadTasks() {
                listStatus.textContent = 'Loading tasks...';
                try {
                    const response = await fetch('/api/tasks', {
                        headers: { 'Accept': 'application/json' }
                    });
                    const result = await response.json().catch(() => ({}));
                    if (!response.ok) throw new Error(result.error || 'Request failed.');
                    tasks = Array.isArray(result.tasks) ? result.tasks : [];
                    renderTasks();
                } catch (error) {
                    listStatus.textContent = `Could not load tasks: ${error.message}`;
                    return;
                }
            }

            async function updateTask(task, changes) {
                try {
                    await manageTask(task, 'complete', changes.completed);
                    Object.assign(task, changes);
                    renderTasks();
                } catch (error) {
                    const errorMessage = error instanceof Error ? error.message : 'An unexpected error occurred.';
                    await loadTasks();
                    listStatus.textContent = `Could not update task: ${errorMessage}`;
                }
            }

            async function deleteTask(task) {
                if (!window.confirm(`Delete “${task.name || 'Untitled task'}”?`)) return;
                try {
                    await manageTask(task, 'delete');
                    tasks = tasks.filter((item) => item.id !== task.id);
                    renderTasks();
                } catch (error) {
                    listStatus.textContent = `Could not delete task: ${error.message}`;
                }
            }

            async function manageTask(task, action, completed) {
                const { data: { session }, error: sessionError } = await supabaseClient.auth.getSession();
                if (sessionError) throw sessionError;
                if (!session?.access_token) throw new Error('Please sign in again.');

                const response = await fetch('/api/tasks/manage', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${session.access_token}`
                    },
                    body: JSON.stringify({ id: task.id, action, completed })
                });
                const result = await response.json().catch(() => ({}));
                if (!response.ok) throw new Error(result.error || 'Task update failed.');
            }

            async function initializePermissions() {
                let editorCanWrite = false;
                try {
                    if (window.GoldenNotesPermissions?.initWriteControls) {
                        const result = await window.GoldenNotesPermissions.initWriteControls(supabaseClient, submitButton);
                        editorCanWrite = Boolean(result?.canWrite);
                    }

                    const { data: { session }, error } = await supabaseClient.auth.getSession();
                    if (error) throw error;
                    let isStaff = false;
                    if (!editorCanWrite && session?.access_token) {
                        const response = await fetch('/auth/moderator/actionpost', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${session.access_token}`
                            },
                            body: JSON.stringify({ action: 'whoami' })
                        });
                        const result = await response.json().catch(() => ({}));
                        if (response.ok) {
                            isStaff = result.success && ['Admin', 'Moderator'].includes(result.rank);
                        } else if (![401, 403].includes(response.status)) {
                            throw new Error(result.error || 'Could not verify staff permissions.');
                        }
                    }

                    canWrite = editorCanWrite || isStaff;
                    canManageTasks = canWrite;
                    window.GoldenNotesPermissions?.setWriteEnabled(
                        submitButton,
                        canWrite,
                        canWrite ? '' : 'Editor, Moderator, or Admin access required'
                    );
                    submitButton.disabled = !canWrite;
                    submitButton.textContent = canWrite ? 'Add task' : 'Editor access required';
                    renderTasks();
                } catch (error) {
                    submitButton.disabled = true;
                    submitButton.textContent = 'Permissions unavailable';
                    setFormStatus(`Could not verify permissions: ${error.message}`, true);
                }
            }

            form.addEventListener('submit', async (event) => {
                event.preventDefault();
                if (!canWrite) {
                    setFormStatus('Editor access is required to create tasks.', true);
                    return;
                }

                const title = document.getElementById('task-title').value.trim();
                const description = document.getElementById('task-description').value.trim();
                const subject = document.getElementById('task-subject').value.trim();
                if (!title || !subject) {
                    form.reportValidity();
                    return;
                }

                submitButton.disabled = true;
                submitButton.textContent = 'Saving...';
                setFormStatus('');
                try {
                    const { data: { session }, error: sessionError } = await supabaseClient.auth.getSession();
                    if (sessionError) throw sessionError;
                    if (!session?.access_token) throw new Error('Please sign in again.');

                    const response = await fetch('/api/tasks', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${session.access_token}`
                        },
                        body: JSON.stringify({ title, description, subject })
                    });
                    const result = await response.json().catch(() => ({}));
                    if (response.status === 422 && result.flagged) {
                        window.location.assign('/auth/cursing.html');
                        return;
                    }
                    if (!response.ok) throw new Error(result.error || 'Could not save task.');

                    form.reset();
                    setFormStatus('Task added.');
                    await loadTasks();
                } catch (error) {
                    console.error('Could not save task:', error);
                    setFormStatus(`Could not save task: ${error.message}`, true);
                } finally {
                    submitButton.disabled = !canWrite;
                    submitButton.textContent = canWrite ? 'Add task' : 'Editor access required';
                }
            });

            filter.addEventListener('change', renderTasks);
            initializePermissions();
            loadTasks();
        })();
    </script>
</body>
</html>
