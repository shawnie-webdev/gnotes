<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tasks | GoldenNotes</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/auth/config.js"></script>
  <script src="/auth/theme.js"></script>
  <link rel="stylesheet" href="/master-combined.css">
  <link rel="stylesheet" href="/master-experimental.css">
  <style>
    main { width: min(100% - 2rem, 960px); margin: 2rem auto 4rem; }
    .task-layout { display: grid; grid-template-columns: minmax(240px, 0.8fr) minmax(0, 1.4fr); gap: 1.5rem; align-items: start; }
    .task-panel { padding: 1.25rem; }
    .task-panel h1, .task-panel h2 { margin-top: 0; }
    .task-form { display: grid; gap: 0.65rem; }
    .task-form label { margin-top: 0.35rem; }
    .task-form textarea { min-height: 105px; resize: vertical; }
    .task-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-bottom: 1rem; }
    .task-toolbar h2 { margin: 0; }
    .task-filter { min-width: 130px; }
    .task-list { display: grid; gap: 0.75rem; }
    .task-item { border: 1px solid var(--border-color, #59616d); border-radius: 6px; padding: 1rem; }
    .task-item.is-complete { opacity: 0.68; }
    .task-item.is-complete .task-title { text-decoration: line-through; }
    .task-item-header { display: flex; align-items: flex-start; gap: 0.75rem; }
    .task-item-header input { margin-top: 0.35rem; }
    .task-item-content { min-width: 0; flex: 1; }
    .task-title { margin: 0; overflow-wrap: anywhere; }
    .task-subject { margin: 0.25rem 0; color: var(--text-secondary, #aab2bd); font-size: 0.9rem; }
    .task-description { margin: 0.75rem 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }
    .task-delete { border: 0; background: transparent; color: var(--danger, #ef4444); cursor: pointer; font: inherit; padding: 0.25rem; }
    .task-delete:disabled, .task-item input:disabled { cursor: wait; opacity: 0.6; }
    .task-message { min-height: 1.4em; }
    @media (max-width: 680px) {
      main { width: min(100% - 1rem, 960px); margin-top: 1rem; }
      .task-layout { grid-template-columns: 1fr; gap: 1rem; }
      .task-panel { padding: 1rem; }
    }
  </style>
<header class="top-header">
  <div class="nav-actions">
    <div class="header-left">
      <img src="/favicon.jpeg" alt="logo" id="logo">
    </div>
    <a href="/credits.html" class="btn btn-primary" id="credits">Credits</a>
    <a href="/" class="btn btn-secondary" id="dashboard">Homepage</a>
    <a href="/man-page/index.html" class="btn btn-secondary">Manual</a>
    <div class="dropdown btn btn-secondary">
      Study
      <div class="dropdown-content">
        <a href="/corkboard" class="btn btn-secondary" id="cb">Corkboard</a>
        <a href="/study" class="btn btn-secondary" id="study">Study Guides</a>
        <a href="/documents" class="btn btn-secondary" id="documents">Documents</a>
        <a href="/calendar" class="btn btn-secondary" id="calendar">Calendar</a>
  
      </div>
    </div>

    <a href="/dashboard/settings" class="btn btn-secondary" id="settings-nav">Settings</a>
    <a href="/dashboard" class="btn btn-secondary" id="d-nav">Dashboard</a>
  </div>
</header>

  <main>
    <div class="task-layout">
      <section class="card task-panel" aria-labelledby="create-task-heading">
        <h1 id="create-task-heading">Add a task</h1>
        <form class="task-form" id="task-form">
          <label for="task-name">Task name</label>
          <input class="form-input" id="task-title" maxlength="150" required>
          <label for="task-description">Description</label>
          <textarea class="form-input" id="task-description" maxlength="2000"></textarea>
          <label for="task-subject">Subject</label>
          <input class="form-input" id="task-subject" maxlength="100" required>
          <button class="submit-btn btn btn-primary" id="submitBtn" type="submit">Add task</button>
          <p class="task-message" id="task-form-status" role="status" aria-live="polite"></p>
        </form>
      </section>

      <section class="card task-panel" aria-labelledby="tasks-heading">
        <div class="task-toolbar">
          <h2 id="tasks-heading">Your tasks</h2>
          <select class="form-input task-filter" id="task-filter" aria-label="Filter tasks">
            <option value="all">All</option>
            <option value="active">Active</option>
            <option value="completed">Completed</option>
          </select>
        </div>
        <p id="task-list-status" class="task-message" role="status" aria-live="polite">Loading tasks...</p>
        <div class="task-list" id="task-list"></div>
      </section>
    </div>
  </main>

  <script>
    const SUPABASE_URL = 'https://cqxlnmvmfkylozcdffxf.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNxeGxubXZtZmt5bG96Y2RmZnhmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg3NDc4OTMsImV4cCI6MjEwNDMyMzg5M30.mpxEjcWdD9Vy0WsHRL7O8n1fWfnKInsBmOgaYsiv_38';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const form = document.getElementById("task-form");
    const submitBtn = document.getElementById("submit");
    let canWrite = false;

    submitBtn.disabled = false;

    window.GoldenNotesPermissions.initWriteControls(supabaseClient, submitBtn).then((result) => {
        canWrite = result.canWrite;
        if (!canWrite) {
            submitBtn.textContent = "Editor access required";
        }
    });

    // 2. Insert payload into Supabase table
    form.addEventListener("submit", async (e) => {
        e.preventDefault();
        if (!canWrite) {
            alert("You do not have editor access to create tasks.");
            return;
        }

        submitBtn.disabled = false;
        submitBtn.textContent = "Saving...";

        const taskTitle = document.getElementById("task-title").value;
        const taskDesc = document.getElementById("task-description").value;
        const taskSubj = document.getElementById("task-subject").value;

        try {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session?.access_token) throw new Error("Please sign in again.");
            const moderationResponse = await fetch('/api/moderate-text', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + session.access_token },
                body: JSON.stringify({ text: [
                    document.getElementById("author").value,
                    document.getElementById("taskTitle").value,
                    taskDesc,
                    document.getElementById("taskSubj").value,
                    editorContent.replace(/<[^>]*>/g, ' ')
                ].join(' ') })
            });
            const moderation = await moderationResponse.json();
            if (!moderationResponse.ok) throw new Error(moderation.error || "Moderation check failed.");
            if (moderation.flagged) {
                window.location.assign('/auth/cursing.html');
                return;
            }
        } catch (moderationError) {
            alert(moderationError.message || "Could not check this task. Please try again.");
            submitBtn.disabled = !canWrite;
            submitBtn.textContent = canWrite ? "Save Task" : "Editor access required";
            return;
        }

        const record = {
            author: document.getElementById("author").value,
            subject: { name: taskTitle},
            data: document.getElementById("task-description"),
            name: document.getElementById("task-subject").value,
        };

        try {
            const { data, error } = await supabaseClient
                .from('tasks')
                .insert([record])
                .select();

            if (error) throw error;

            alert("Task saved successfully!");
            form.reset();
            window.location.href = "/student-resources/tasks.html";
        } catch (err) {
            console.error("Error inserting data:", err);
            alert("Failed to save task: " + err.message);
        } finally {
            submitBtn.disabled = !canWrite;
            submitBtn.textContent = canWrite ? "Save Task" : "Editor access required";
        }
    });

    // Display tasks

    const container = document.getElementById('topics-container');
    const info = document.getElementById('info');

    if (!window.supabase) {
        console.error("Supabase CDN failed to load. Check script inclusion.");
    }


    // Navigation listener for Add Topic button with safety check
    const addTopicBtn = document.getElementById('submitBtn');
    if (addTopicBtn) {
        addTopicBtn.addEventListener('click', () => {
            if (!canWrite) return;
            window.location.href = "";
        });
    }

    // Initialize write permissions safely
    if (window.GoldenNotesPermissions && addTopicBtn) {
        window.GoldenNotesPermissions.initWriteControls(
            supabaseClient,
            addTopicBtn
        ).then((result) => {
            if (result) {
                canWrite = result.canWrite;
            }
        }).catch(err => console.error("Permissions error:", err));
    }

    async function displayTasks(search = '') {
        if (!container) return;

        const { data: tasks, error } = await supabaseClient
            .from('study')
            .select('*')
            .order('created_at', { ascending: false });

        if (error) {
            if (info) info.innerHTML = `<p style="color: #ef4444;">Failed to load topics: ${escapeHtml(error.message)}</p>`;
            return;
        }

        if (!topics || topics.length === 0) {
            if (info) info.innerHTML = `<p style="color: #cbd5e1;">No topics created yet.</p>`;
            return;
        }

        // Clear loading/info message
        if (info) info.innerHTML = '';
        let renderedCount = 0;

        task.forEach(task => {
            const taskSubject = task.subject?.name || 'General';
            const taskName = task.name || '';

            if (topicName.toLowerCase().includes(search.toLowerCase())) {
                renderedCount++;

                const card = document.createElement('div');
                card.className = 'card effect_button card';

                card.innerHTML = `
                        <div class="card-header" data-id="${task.id}">
                            <span class="card-member badge-subject">${escapeHtml(taskName)}</span>
                            <span class="card-member badge-sg">${escapeHtml(task.sg || 'SG N/A')}</span>
                        </div>
                        <h3 class="card-member">${escapeHtml(taskName)}</h3>
                        <div class="card-member card-footer">
                            <small>By: ${escapeHtml(task.author || 'Anonymous')}</small>
                        </div>
                    `;

                card.addEventListener('click', () => {
                    window.location.href = `/study/view?id=${task.id}`;
                });

                container.appendChild(card);
            }
        });

        if (renderedCount === 0 && info) {
            info.innerHTML = `<p style="color: #cbd5e1;">No matching topics found for "${escapeHtml(search)}".</p>`;
        }
    }

    function escapeHtml(str) {
        return String(str)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;");
    }

    // Initialization
    const params = new URLSearchParams(window.location.search);
    let searchparams = params.get("search");

    if (searchparams !== null) {
        searchparams = decodeURIComponent(searchparams).trim();
        const searchBar = document.getElementById('search-bar');
        if (searchBar) searchBar.value = searchparams;
        displayTasks(searchparams);
    } else {
        displayTasks();
    }
  </script>
</body>
</html>
