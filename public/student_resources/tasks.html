<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GoldenNotes v1.2</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">

  <!-- Supabase JS Client via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/auth/config.js"></script>
  <script src="/auth/permissions.js"></script>
  <script src="/auth/theme.js"></script>
  <link rel="stylesheet" href="/master-combined.css">
  <link rel="stylesheet" href="/master-experimental.css">

  <section class="card" aria-labelledby="create-task-heading">
    <h2 id="create-task-heading">Add a task</h2>
    <form id="task-form">
      <label for="task-name">Task name</label>
      <input class="form-input" id="task-name" maxlength="150" required>

      <label for="task-description">Task description</label>
      <textarea class="form-input" id="task-description" maxlength="2000" required></textarea>

      <label for="task-subject">Task subject</label>
      <input class="form-input" id="task-subject" maxlength="100" required>

      <button class="btn btn-secondary" id="create-task" type="submit">Add Task</button>
      <p id="task-form-status" role="status" aria-live="polite"></p>
    </form>
  </section>

  <section aria-labelledby="tasks-heading">
    <h2 id="tasks-heading">Tasks</h2>
    <p id="tasks-status" role="status" aria-live="polite">Loading tasks...</p>
    <div id="tasks-list"></div>
  </section>
    <a href="/man-page/index.html" class="btn btn-secondary">Manual</a>
    <div class="dropdown btn btn-secondary">
<script>
    const SUPABASE_URL = 'https://cqxlnmvmfkylozcdffxf.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNxeGxubXZtZmt5bG96Y2RmZnhmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg3NDc4OTMsImV4cCI6MjEwNDMyMzg5M30.mpxEjcWdD9Vy0WsHRL7O8n1fWfnKInsBmOgaYsiv_38';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const taskForm = document.getElementById('task-form');
    const createTaskButton = document.getElementById('create-task');
    const taskFormStatus = document.getElementById('task-form-status');
    const tasksStatus = document.getElementById('tasks-status');
    const tasksList = document.getElementById('tasks-list');
    let canWrite = false;

    function showStatus(element, message, isError = false) {
      element.textContent = message;
      element.style.color = isError ? '#ef4444' : '';
    }

    function renderTask(task) {
      const card = document.createElement('article');
      card.className = 'card';

      const title = document.createElement('h3');
      title.textContent = task.name || 'Untitled task';

      const subject = document.createElement('p');
      subject.textContent = `Subject: ${task.subj || 'General'}`;

      const description = document.createElement('p');
      description.textContent = task.desc || '';

      card.append(title, subject, description);
      return card;
    }

    async function loadTasks() {
      if (!supabaseClient) {
        showStatus(tasksStatus, 'Supabase could not be initialized.', true);
        return;
      }

      const { data: tasks, error } = await supabaseClient
        .from('tasks')
        .select('name, desc, subj');

      if (error) {
        showStatus(tasksStatus, `Could not load tasks: ${error.message}`, true);
        return;
      }

      tasksList.replaceChildren(...(tasks || []).map(renderTask));
      showStatus(tasksStatus, tasks?.length ? '' : 'No tasks have been added yet.');
    }

    if (supabaseClient && window.GoldenNotesPermissions) {
      window.GoldenNotesPermissions.initWriteControls(supabaseClient, createTaskButton)
        .then((result) => {
          canWrite = result.canWrite;
          if (!canWrite) createTaskButton.textContent = 'Editor access required';
        })
        .catch(() => showStatus(taskFormStatus, 'Could not verify editor access.', true));
    } else {
      createTaskButton.disabled = true;
      showStatus(taskFormStatus, 'Supabase or editor permissions could not be initialized.', true);
    }

    taskForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      if (!supabaseClient) return;
      if (!canWrite) {
        showStatus(taskFormStatus, 'Sign in with an editor account to add tasks.', true);
        return;
      }

      createTaskButton.disabled = true;
      showStatus(taskFormStatus, 'Adding task...');

      const task = {
        name: document.getElementById('task-name').value.trim(),
        desc: document.getElementById('task-description').value.trim(),
        subj: document.getElementById('task-subject').value.trim()
      };

      const { error } = await supabaseClient.from('tasks').insert(task);
      if (error) {
        showStatus(taskFormStatus, `Could not add task: ${error.message}`, true);
        createTaskButton.disabled = false;
        return;
      }

      taskForm.reset();
      showStatus(taskFormStatus, 'Task added.');
      createTaskButton.disabled = false;
      await loadTasks();
    });

    loadTasks();
      taskForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        if (!supabaseClient) return;
        if (!canWrite) {
          showStatus(taskFormStatus, 'Sign in with an editor account to add tasks.', true);
          return;
        }

        createTaskButton.disabled = true;
        showStatus(taskFormStatus, 'Adding task...');

        const task = {
          name: document.getElementById('task-name').value.trim(),
          description: document.getElementById('task-description').value.trim(),
          subject: document.getElementById('task-subject').value.trim()
        };

        const { error } = await supabaseClient.from('tasks').insert(task);
        if (error) {
          showStatus(taskFormStatus, `Could not add task: ${error.message}`, true);
          createTaskButton.disabled = false;
          return;
        }

        taskForm.reset();
        showStatus(taskFormStatus, 'Task added.');
        createTaskButton.disabled = false;
        await loadTasks();
      });

      loadTasks();
      
</script>

</body>
</html>
