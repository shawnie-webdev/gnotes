<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quizzes · GoldenNotes</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/auth/config.js"></script><script src="/auth/theme.js"></script><style>
:root{color-scheme:dark;--bg:#101713;--panel:#18231c;--line:#2d4434;--accent:#70e08b;--text:#e8f3e9;--muted:#a7b8aa}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px system-ui,sans-serif}main{max-width:950px;margin:32px auto;padding:20px}h1{color:var(--accent)}a{color:var(--accent)}.panel,.question,.quiz-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin:14px 0}input,textarea,select{width:100%;padding:11px;border-radius:8px;border:1px solid var(--line);background:#0c120e;color:var(--text);margin:6px 0 12px}button,.button{display:inline-block;background:var(--accent);color:#102015;font-weight:700;border:0;border-radius:9px;padding:11px 16px;cursor:pointer;text-decoration:none;margin:4px}button.secondary{background:#26382b;color:var(--text)}label{display:block;color:var(--muted)}.muted{color:var(--muted)}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:180px}.error{color:#ff9a9a}.success{color:var(--accent)}.option{display:flex;align-items:center;gap:8px;margin:8px 0}.option input{width:auto;margin:0}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
</style></head><body><main><div class="top"><div><h1>Study Quizzes</h1><p class="muted">Browse quizzes published by GoldenNotes editors.</p></div><a class="button" href="/quiz/make">Make a quiz</a></div><div id="quizzes"><p class="muted">Loading quizzes…</p></div><p><a href="/study">← Back to Study Guides</a></p></main><script>
(async()=>{const root=document.querySelector('#quizzes');try{const r=await fetch('/api/quizzes');const d=await r.json();if(!r.ok)throw Error(d.error||'Could not load quizzes');if(!d.quizzes.length){root.innerHTML='<div class="panel">No quizzes have been published yet.</div>';return}root.innerHTML=d.quizzes.map(q=>'<article class="quiz-card"><h2>'+esc(q.metadata?.title||'Untitled quiz')+'</h2><p>'+esc(q.metadata?.description||'')+'</p><p class="muted">Created '+new Date(q.created_on).toLocaleString()+'</p><a class="button" href="/quiz/answer?uuid='+encodeURIComponent(q.uuid)+'">Take quiz</a></article>').join('')}catch(e){root.innerHTML='<p class="error">'+esc(e.message)+'</p>'}function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}})();
</script></body></html>
