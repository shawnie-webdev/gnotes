<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Create quiz | GoldenNotes</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #101510;
        --panel: #19221b;
        --line: #314433;
        --green: #8ee69a;
        --muted: #b5c4b6;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: #edf5ee;
        font:
          16px system-ui,
          sans-serif;
      }
      main {
        max-width: 850px;
        margin: auto;
        padding: 24px;
      }
      a {
        color: var(--green);
      }
      input,
      textarea,
      select {
        width: 100%;
        padding: 11px;
        margin: 5px 0 14px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #111a13;
        color: #fff;
      }
      label {
        display: block;
        font-weight: 600;
      }
      button,
      .btn {
        cursor: pointer;
        padding: 10px 14px;
        border: 1px solid var(--line);
        border-radius: 9px;
        background: #223b28;
        color: #effff0;
        text-decoration: none;
        margin: 4px 4px 4px 0;
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 16px;
        margin: 12px 0;
      }
      small,
      p {
        color: var(--muted);
      }
    </style>
    <link rel="stylesheet" href="../master-combined.css">
    <link rel="stylesheet" href="../master-experimental.css">
  </head>
  <body>
    <main>
      <p><a href="/quiz">← All quizzes</a></p>
      <h1>Create a quiz</h1>
      <p>Only editors, moderators, and admins can publish quizzes.</p>
      <label
        >Quiz title<input
          id="title"
          maxlength="120"
          required
          placeholder="e.g. Biology basics" /></label
      ><label
        >Description<textarea
          id="description"
          rows="2"
          maxlength="500"
        ></textarea>
      </label>
      <div id="questions"></div>
      <button id="add">+ Add question</button>
      <button id="publish">Publish quiz</button>
      <p id="status" role="status"></p>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/auth/config.js"></script>
    <link rel="stylesheet" href="../../master-combined.css">
    <link rel="stylesheet" href="../../master-experimental.css">
    <script>
      const host = document.querySelector("#questions"),
        status = document.querySelector("#status");
      let seq = 0;
      function addQuestion() {
        const c = document.createElement("section");
        c.className = "card";
        c.innerHTML =
          '<label>Question <input class="prompt" maxlength="500" placeholder="Enter question text"></label><label>Type<select class="type"><option value="single">Single-answer multiple choice</option><option value="multiple">Multiple-answer multiple choice</option><option value="text">Text answer</option><option value="scale">Scale (1–5)</option></select></label><label>Options (one per line)<textarea class="options" rows="3" placeholder="Option A&#10;Option B&#10;Option C"></textarea></label><label>Correct answer(s), one per line<textarea class="answers" rows="2"></textarea><small>For text questions, list accepted answers. Scale questions are not auto-graded.</small></label><button type="button" class="remove">Remove question</button>';
        c.querySelector(".type").addEventListener("change", () => {
          const t = c.querySelector(".type").value;
          c.querySelector(".options").disabled = t === "text" || t === "scale";
          c.querySelector(".answers").disabled = t === "scale";
        });
        c.querySelector(".remove").onclick = () => c.remove();
        host.append(c);
      }
      document.querySelector("#add").onclick = addQuestion;
      addQuestion();
      document.querySelector("#publish").onclick = async () => {
        status.textContent = "";
        const title = document.querySelector("#title").value.trim();
        const questions = [...host.children].map((c) => ({
          type: c.querySelector(".type").value,
          prompt: c.querySelector(".prompt").value.trim(),
          options: c
            .querySelector(".options")
            .value.split("\n")
            .map((x) => x.trim())
            .filter(Boolean),
          answer: c
            .querySelector(".answers")
            .value.split("\n")
            .map((x) => x.trim())
            .filter(Boolean),
        }));
        if (!title || !questions.length || questions.some((q) => !q.prompt)) {
          status.textContent =
            "Add a title and at least one question with question text.";
          return;
        }
        try {
          const client =
            window.supabaseClient || window.GoldenNotesConfig?.initClient?.();
          if (!client)
            throw Error(
              "Could not initialize sign-in. Reload and sign in again.",
            );
          const {
            data: { session },
            error,
          } = await client.auth.getSession();
          if (error || !session) throw Error("Please sign in first.");
          const r = await fetch("/api/quizzes", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: "Bearer " + session.access_token,
            },
            body: JSON.stringify({
              title,
              description: document.querySelector("#description").value.trim(),
              questions,
            }),
          });
          const d = await r.json();
          if (!r.ok) throw Error(d.error || "Publish failed");
          status.textContent = "Quiz published!";
          location.href =
            "/quiz/answer?uuid=" + encodeURIComponent(d.quiz.uuid);
        } catch (e) {
          status.textContent = e.message;
        }
      };
    </script>
  </body>
</html>
