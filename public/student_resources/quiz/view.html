<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Take quiz | GoldenNotes</title>
    <style>
      /* Quiz-specific layout only; palette and theme come from master-combined.css. */
      main.quiz-page {
        width: min(100%, 900px);
        margin: 28px auto 56px;
        padding: 0 12px;
      }
      #title { margin: 12px 0 8px; line-height: 1.2; overflow-wrap: anywhere; }
      #description { color: var(--text-muted); margin: 0 0 22px; line-height: 1.6; }
      #form { display: flex; flex-direction: column; gap: 14px; }
      #form .quiz-question {
        width: 100%;
        margin: 0;
        padding: clamp(16px, 3vw, 24px);
      }
      #form .quiz-question h2 {
        font-size: clamp(1.05rem, 2.3vw, 1.35rem);
        line-height: 1.45;
        margin: 0 0 14px;
        overflow-wrap: anywhere;
      }
      #form label.option {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        padding: 9px 10px;
        margin: 2px 0;
        border-radius: var(--radius-md);
        line-height: 1.45;
        cursor: pointer;
      }
      #form label.option:hover { background: color-mix(in srgb, var(--main-gold) 8%, transparent); }
      #form input[type="radio"],
      #form input[type="checkbox"] {
        flex: 0 0 auto;
        width: auto;
        margin: 4px 0 0;
        accent-color: var(--main-gold);
      }
      #form input[type="text"],
      #form textarea,
      #form select {
        display: block;
        box-sizing: border-box;
        width: 100%;
        max-width: 100%;
        min-height: 42px;
        margin: 8px 0 0;
        padding: 10px 12px;
        border: 1px solid var(--border-color);
        border-radius: var(--radius-md);
        background: var(--bg-main);
        color: var(--text-main);
        font: inherit;
        font-size: 0.96rem;
        text-align: left;
      }
      #form select { align-self: flex-start; }
      #form input[type="text"]:focus,
      #form textarea:focus,
      #form select:focus { outline: 2px solid var(--main-gold); outline-offset: 2px; }
      #form button[type="submit"] { align-self: flex-start; }
      #status { min-height: 1.5em; margin-top: 16px; color: var(--text-muted); line-height: 1.6; }
      #status:empty { display: none; }
      @media (max-width: 600px) {
        main.quiz-page { margin-top: 18px; padding: 0 4px; }
        #form .quiz-question { padding: 15px; }
      }
    </style>
    <link rel="stylesheet" href="../master-combined.css">
    <link rel="stylesheet" href="../master-experimental.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/auth/config.js"></script>
    <script src="/auth/theme.js"></script>
    <script src="/auth/theme-experimental.js"></script>
  </head>
  <body>
  <header class="top-header">
    <div class="nav-actions">
      <div class="header-left">
        <img src="/favicon.jpeg" alt="logo" id="logo">
      </div>
      <a href="/credits.html" class="btn btn-primary" id="credits">Credits</a>
      <a href="/" class="btn btn-secondary" id="dashboard">Homepage</a>
      <a href="/man-page/index.html" class="btn btn-secondary">Manual</a>
      <div class="dropdown btn btn-secondary">
        Study
        <div class="dropdown-content">
          <a href="/corkboard" class="btn btn-secondary" id="cb">Corkboard</a>
          <a href="/study" class="btn btn-secondary" id="study">Study Guides</a>
          <a href="/documents" class="btn btn-secondary" id="documents">Documents</a>
          <a href="/calendar" class="btn btn-secondary" id="calendar">Calendar</a>
          <a href="/quiz" class="btn btn-secondary" id="calendar">Quiz</a>

        </div>
      </div>

      <a href="/dashboard/settings" class="btn btn-secondary" id="settings-nav">Settings</a>
      <a href="/dashboard" class="btn btn-secondary" id="d-nav">Dashboard</a>
    </div>
  </header>
    <main class="quiz-page">
      <p><a href="/quiz">← All quizzes</a></p>
      <h1 id="title">Loading quiz…</h1>
      <p id="description"></p>
      <p id="topic" class="topic-badge">Loading topic…</p>
      <p id="difficulty" class="difficulty-badge">Loading…</p>
      <form id="form"></form>
      <p id="status" role="status"></p>
    </main>
    <script>
      function normalizeDifficulty(value) {
        const safe = (value || "medium").toString().trim().toLowerCase();
        const allowed = ["easy", "medium", "hard", "expert"];
        return allowed.includes(safe) ? safe : "medium";
      }

      function difficultyClass(value) {
        return "difficulty-" + normalizeDifficulty(value);
      }

      const id =
        new URLSearchParams(location.search).get("uuid") ||
        location.search.replace(/^\?=/, "").split("&")[0];
      const form = document.querySelector("#form"),
        status = document.querySelector("#status");

      async function load() {
        try {
          if (!id) throw Error("Quiz ID is missing from the URL.");
          const r = await fetch("/api/quizzes/" + encodeURIComponent(id));
          const d = await r.json();
          if (!r.ok) throw Error(d.error || "Quiz not found");

          const qz = d.quiz;
          document.querySelector("#title").textContent = qz.metadata?.title || "Quiz";
          document.querySelector("#description").textContent = qz.metadata?.description || "";
          document.querySelector("#topic").textContent = qz.metadata?.topic || "Topic not set";

          const difficultyNode = document.querySelector("#difficulty");
          const difficultyValue = normalizeDifficulty(qz.metadata?.difficulty || qz.difficulty);
          difficultyNode.textContent = difficultyValue;
          difficultyNode.className = "difficulty-badge " + difficultyClass(difficultyValue);

          qz.questions.forEach((q, i) => {
            const box = document.createElement("section");
            box.className = "card quiz-question";
            const h = document.createElement("h2");
            h.textContent = i + 1 + ". " + q.prompt;
            box.append(h);

            if (q.type === "single" || q.type === "multiple") {
              (q.options || []).forEach((o) => {
                const label = document.createElement("label");
                label.className = "option";
                const input = document.createElement("input");
                input.type = q.type === "multiple" ? "checkbox" : "radio";
                input.name = "q" + i;
                input.value = o;
                label.append(input, document.createTextNode(" " + o));
                box.append(label);
              });
            } else if (q.type === "scale") {
              const sel = document.createElement("select");
              sel.name = "q" + i;
              sel.innerHTML =
                '<option value="">Choose 1–5</option>' +
                [1, 2, 3, 4, 5]
                  .map((n) => '<option value="' + n + '">' + n + "</option>")
                  .join("");
              box.append(sel);
            } else {
              const input = document.createElement("input");
              input.type = "text";
              input.name = "q" + i;
              input.maxLength = 1000;
              input.placeholder = "Your answer";
              box.append(input);
            }

            form.append(box);
          });

          const btn = document.createElement("button");
          btn.type = "submit";
          btn.textContent = "Submit answers";
          form.append(btn);
          form.dataset.loaded = "yes";
          form.dataset.count = qz.questions.length;
        } catch (e) {
          status.textContent = e.message;
        }
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        if (form.dataset.loaded !== "yes") return;

        const answers = [];
        for (let i = 0; i < Number(form.dataset.count); i++) {
          const els = [...form.querySelectorAll('[name="q' + i + '"]')];
          answers.push(
            els.length && els[0].type === "checkbox"
              ? els.filter((x) => x.checked).map((x) => x.value)
              : (els.find((x) => x.checked)?.value ?? els[0]?.value ?? ""),
          );
        }

        try {
          const r = await fetch(
            "/api/quizzes/" + encodeURIComponent(id) + "/answer",
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ answers }),
            },
          );
          const d = await r.json();
          if (!r.ok) throw Error(d.error || "Could not submit answers");
          status.textContent = d.gradable
            ? "Score: " +
              d.correct +
              " / " +
              d.gradable +
              " automatically gradable questions. " +
              d.message
            : d.message;
          form.querySelector("button[type=submit]").disabled = true;
        } catch (err) {
          status.textContent = err.message;
        }
      });

      load();
    </script>
  </body>
</html>
