<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Take quiz | GoldenNotes</title>
    <style>
      :root {
        color-scheme: dark;
        --quiz-panel: var(--panel, #17221a);
        --quiz-line: var(--line, #304535);
        --quiz-text: var(--text, #edf5ee);
        --quiz-muted: var(--muted, #aebcaf);
      }
      body { color: var(--quiz-text); }
      main {
        width: min(100% - 32px, 860px);
        margin: 28px auto 56px;
      }
      #title { margin: 12px 0 8px; line-height: 1.2; overflow-wrap: anywhere; }
      #description { color: var(--quiz-muted); margin: 0 0 22px; line-height: 1.6; }
      #form { display: flex; flex-direction: column; gap: 14px; }
      #form .card {
        box-sizing: border-box;
        width: 100%;
        background: var(--quiz-panel);
        border: 1px solid var(--quiz-line);
        border-radius: 14px;
        padding: clamp(16px, 3vw, 24px);
        margin: 0;
        box-shadow: 0 4px 16px rgb(0 0 0 / 10%);
      }
      #form .card h2 { font-size: clamp(1.05rem, 2.3vw, 1.35rem); line-height: 1.45; margin: 0 0 14px; overflow-wrap: anywhere; }
      #form label.option {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        padding: 9px 10px;
        margin: 2px 0;
        border-radius: 8px;
        line-height: 1.45;
        cursor: pointer;
      }
      #form label.option:hover { background: rgb(120 180 130 / 8%); }
      #form input[type="radio"],
      #form input[type="checkbox"] {
        flex: 0 0 auto;
        width: auto;
        margin: 4px 0 0;
        accent-color: #80c98a;
      }
      #form input[type="text"],
      #form textarea,
      #form select {
        display: block;
        box-sizing: border-box;
        width: 100%;
        max-width: 100%;
        min-height: 42px;
        margin: 8px 0 0;
        padding: 10px 12px;
        border: 1px solid var(--quiz-line);
        border-radius: 9px;
        background: #111a13;
        color: var(--quiz-text);
        font: inherit;
        font-size: 0.96rem;
        text-align: left;
      }
      #form select { appearance: auto; align-self: flex-start; }
      #form input[type="text"]:focus,
      #form textarea:focus,
      #form select:focus { outline: 2px solid #80c98a; outline-offset: 2px; }
      #form button[type="submit"] {
        align-self: flex-start;
        border: 1px solid #35583d;
        border-radius: 10px;
        padding: 11px 17px;
        background: #24432c;
        color: #f2fff3;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
        transition: background .15s ease, transform .15s ease;
      }
      #form button[type="submit"]:hover { background: #2f5739; }
      #form button[type="submit"]:active { transform: translateY(1px); }
      #form button[type="submit"]:disabled { opacity: .65; cursor: wait; }
      #status { min-height: 1.5em; margin-top: 16px; color: var(--quiz-muted); line-height: 1.6; }
      #status:empty { display: none; }
      @media (max-width: 600px) {
        main { width: calc(100% - 24px); margin-top: 18px; }
        #form .card { padding: 15px; }
      }
    </style>
    <link rel="stylesheet" href="../master-combined.css">
    <link rel="stylesheet" href="../master-experimental.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/auth/config.js"></script>
    <script src="/auth/theme.js"></script>
    <script src="/auth/theme-experimental.js"></script>
    </head>
  <body>
  <header class="top-header">
    <div class="nav-actions">
      <div class="header-left">
        <img src="/favicon.jpeg" alt="logo" id="logo">
      </div>
      <a href="/credits.html" class="btn btn-primary" id="credits">Credits</a>
      <a href="/" class="btn btn-secondary" id="dashboard">Homepage</a>
      <a href="/man-page/index.html" class="btn btn-secondary">Manual</a>
      <div class="dropdown btn btn-secondary">
        Study
        <div class="dropdown-content">
          <a href="/corkboard" class="btn btn-secondary" id="cb">Corkboard</a>
          <a href="/study" class="btn btn-secondary" id="study">Study Guides</a>
          <a href="/documents" class="btn btn-secondary" id="documents">Documents</a>
          <a href="/calendar" class="btn btn-secondary" id="calendar">Calendar</a>
          <a href="/quiz" class="btn btn-secondary" id="calendar">Quiz</a>

        </div>
      </div>

      <a href="/dashboard/settings" class="btn btn-secondary" id="settings-nav">Settings</a>
      <a href="/dashboard" class="btn btn-secondary" id="d-nav">Dashboard</a>
    </div>
  </header>
    <main>
      <p><a href="/quiz">← All quizzes</a></p>
      <h1 id="title">Loading quiz…</h1>
      <p id="description"></p>
      <form id="form"></form>
      <p id="status" role="status"></p>
    </main>
    <script>
      const id =
        new URLSearchParams(location.search).get("uuid") ||
        location.search.replace(/^\?=/, "").split("&")[0];
      const form = document.querySelector("#form"),
        status = document.querySelector("#status");
      async function load() {
        try {
          if (!id) throw Error("Quiz ID is missing from the URL.");
          const r = await fetch("/api/quizzes/" + encodeURIComponent(id));
          const d = await r.json();
          if (!r.ok) throw Error(d.error || "Quiz not found");
          const qz = d.quiz;
          document.querySelector("#title").textContent =
            qz.metadata?.title || "Quiz";
          document.querySelector("#description").textContent =
            qz.metadata?.description || "";
          qz.questions.forEach((q, i) => {
            const box = document.createElement("section");
            box.className = "card";
            const h = document.createElement("h2");
            h.textContent = i + 1 + ". " + q.prompt;
            box.append(h);
            if (q.type === "single" || q.type === "multiple") {
              (q.options || []).forEach((o) => {
                const label = document.createElement("label");
                label.className = "option";
                const input = document.createElement("input");
                input.type = q.type === "multiple" ? "checkbox" : "radio";
                input.name = "q" + i;
                input.value = o;
                label.append(input, document.createTextNode(" " + o));
                box.append(label);
              });
            } else if (q.type === "scale") {
              const sel = document.createElement("select");
              sel.name = "q" + i;
              sel.innerHTML =
                '<option value="">Choose 1–5</option>' +
                [1, 2, 3, 4, 5]
                  .map((n) => '<option value="' + n + '">' + n + "</option>")
                  .join("");
              box.append(sel);
            } else {
              const input = document.createElement("input");
              input.type = "text";
              input.name = "q" + i;
              input.maxLength = 1000;
              input.placeholder = "Your answer";
              box.append(input);
            }
            form.append(box);
          });
          const btn = document.createElement("button");
          btn.type = "submit";
          btn.textContent = "Submit answers";
          form.append(btn);
          form.dataset.loaded = "yes";
          form.dataset.count = qz.questions.length;
        } catch (e) {
          status.textContent = e.message;
        }
      }
      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        if (form.dataset.loaded !== "yes") return;
        const answers = [];
        for (let i = 0; i < Number(form.dataset.count); i++) {
          const els = [...form.querySelectorAll('[name="q' + i + '"]')];
          answers.push(
            els.length && els[0].type === "checkbox"
              ? els.filter((x) => x.checked).map((x) => x.value)
              : (els.find((x) => x.checked)?.value ?? els[0]?.value ?? ""),
          );
        }
        try {
          const r = await fetch(
            "/api/quizzes/" + encodeURIComponent(id) + "/answer",
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ answers }),
            },
          );
          const d = await r.json();
          if (!r.ok) throw Error(d.error || "Could not submit answers");
          status.textContent = d.gradable
            ? "Score: " +
              d.correct +
              " / " +
              d.gradable +
              " automatically gradable questions. " +
              d.message
            : d.message;
          form.querySelector("button[type=submit]").disabled = true;
        } catch (err) {
          status.textContent = err.message;
        }
      });
      load();
    </script>
  </body>
</html>
