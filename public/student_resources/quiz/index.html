<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Quizzes | GoldenNotes</title>
    <style>
        main {
        max-width: 900px;
        margin: auto;
        padding: 24px;
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        flex-wrap: wrap;
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 18px;
        margin: 12px 0;
      }
      .muted {
        color: var(--muted);
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/auth/config.js"></script>
    <script src="/auth/theme.js"></script>
    <script src="/auth/theme-experimental.js"></script>
    <link rel="stylesheet" href="../master-combined.css">
    <link rel="stylesheet" href="../master-experimental.css">
  </head>
  <body>
    <header>
      <div>
        <h1>Quizzes</h1>
        <p>Practice and test your knowledge.</p>
      </div>
      <a class="btn" href="/quiz/make">Create a quiz</a>
    </header>
    <main>
      <p id="status">Loading quizzes…</p>
      <section id="quizzes"></section>
    </main>
    <script>
      async function load() {
        const status = document.querySelector("#status"),
          list = document.querySelector("#quizzes");
        try {
          const r = await fetch("/api/quizzes");
          const d = await r.json();
          if (!r.ok) throw Error(d.error || "Unable to load quizzes");
          list.replaceChildren();
          if (!d.quizzes?.length) {
            status.textContent = "No quizzes have been published yet.";
            return;
          }
          status.textContent = "Published quizzes";
          for (const q of d.quizzes) {
            const card = document.createElement("article");
            card.className = "card";
            const title = document.createElement("h2");
            title.textContent = q.metadata?.title || "Untitled quiz";
            const desc = document.createElement("p");
            desc.textContent =
              q.metadata?.description || "No description provided.";
            const count = document.createElement("p");
            count.className = "muted";
            count.textContent = (q.questions?.length || 0) + " questions";
            const link = document.createElement("a");
            link.className = "btn";
            link.href = "/quiz/answer?uuid=" + encodeURIComponent(q.uuid);
            link.textContent = "Take quiz";
            card.append(title, desc, count, link);
            list.append(card);
          }
        } catch (e) {
          status.textContent = "Could not load quizzes: " + e.message;
        }
      }
      load();
    </script>
  </body>
</html>
