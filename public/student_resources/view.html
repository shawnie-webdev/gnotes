<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Take Quiz · GoldenNotes</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/auth/config.js"></script><script src="/auth/theme.js"></script><style>
:root{color-scheme:dark;--bg:#101713;--panel:#18231c;--line:#2d4434;--accent:#70e08b;--text:#e8f3e9;--muted:#a7b8aa}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px system-ui,sans-serif}main{max-width:950px;margin:32px auto;padding:20px}h1{color:var(--accent)}a{color:var(--accent)}.panel,.question,.quiz-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin:14px 0}input,textarea,select{width:100%;padding:11px;border-radius:8px;border:1px solid var(--line);background:#0c120e;color:var(--text);margin:6px 0 12px}button,.button{display:inline-block;background:var(--accent);color:#102015;font-weight:700;border:0;border-radius:9px;padding:11px 16px;cursor:pointer;text-decoration:none;margin:4px}button.secondary{background:#26382b;color:var(--text)}label{display:block;color:var(--muted)}.muted{color:var(--muted)}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:180px}.error{color:#ff9a9a}.success{color:var(--accent)}.option{display:flex;align-items:center;gap:8px;margin:8px 0}.option input{width:auto;margin:0}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
</style></head><body><main><div class="top"><div><h1 id="title">Loading quiz…</h1><p id="description" class="muted"></p></div><a href="/quiz">← All quizzes</a></div><form id="answers"><div id="questions"></div><button type="submit">Submit answers</button></form><section id="result" class="panel" hidden></section></main><script>
const uuid=new URLSearchParams(location.search).get('uuid');const root=document.querySelector('#questions'),form=document.querySelector('#answers'),result=document.querySelector('#result');let quiz;
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
(async()=>{try{if(!uuid)throw Error('Quiz UUID is missing from the URL.');const r=await fetch('/api/quizzes/'+encodeURIComponent(uuid));const d=await r.json();if(!r.ok)throw Error(d.error||'Could not load quiz');quiz=d.quiz;document.querySelector('#title').textContent=quiz.metadata?.title||'Untitled quiz';document.querySelector('#description').textContent=quiz.metadata?.description||'';root.innerHTML=quiz.questions.map((q,i)=>{let controls='';if(q.type==='single'||q.type==='multiple')controls=(q.options||[]).map(o=>'<label class="option"><input type="'+(q.type==='single'?'radio':'checkbox')+'" name="q'+i+'" value="'+esc(o)+'"> '+esc(o)+'</label>').join('');else if(q.type==='text')controls='<input name="q'+i+'" placeholder="Your answer">';else if(q.type==='scale')controls='<label>'+esc(q.minLabel||q.min)+' <input name="q'+i+'" type="range" min="'+Number(q.min)+'" max="'+Number(q.max)+'" value="'+Number(q.min)+'" oninput="this.nextElementSibling.value=this.value"><output>'+Number(q.min)+'</output> '+esc(q.maxLabel||q.max)+'</label>';return '<section class="question"><h3>'+(i+1)+'. '+esc(q.prompt)+'</h3>'+controls+'</section>'}).join('')}catch(e){root.innerHTML='<p class="error">'+esc(e.message)+'</p>';form.querySelector('button').disabled=true}})();
form.addEventListener('submit',async e=>{e.preventDefault();if(!quiz)return;const answers={};quiz.questions.forEach((q,i)=>{const els=[...form.querySelectorAll('[name="q'+i+'"]')];answers[i]=q.type==='multiple'?els.filter(x=>x.checked).map(x=>x.value):q.type==='single'?(els.find(x=>x.checked)?.value||''):els[0]?.value||''});try{const r=await fetch('/api/quizzes/'+encodeURIComponent(uuid)+'/answer',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({answers})});const d=await r.json();if(!r.ok)throw Error(d.error||'Could not submit');result.hidden=false;result.innerHTML='<h2>Quiz submitted</h2><p>'+esc(d.message)+'</p>'+(d.gradable?'<p><strong>Score: '+d.correct+' / '+d.gradable+'</strong></p>':'')+'<p class="muted">Scale questions and text questions without an accepted answer are not automatically graded.</p>';result.scrollIntoView({behavior:'smooth'})}catch(err){result.hidden=false;result.textContent=err.message}});
</script></body></html>
