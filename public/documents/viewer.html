<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoldenNotes - Document Management</title>

    <!-- Project Stylesheets -->
    <link rel="stylesheet" href="./../style.css">
    <link rel="stylesheet" href="./../master.css">

    <!-- Supabase JS Client CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .doc-container {
            max-width: 900px;
            margin: 30px auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            box-sizing: border-box;
            color: #0f172a;
        }

        .doc-container h3 {
            margin-top: 0;
            color: #0f172a;
        }

        .btn-refresh {
            background-color: #059669;
            color: #ffffff;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 20px;
        }

        .btn-refresh:hover {
            background-color: #047857;
        }

        .pdf-card {
            background: #f8fafc;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 16px;
            border: 1px solid #cbd5e1;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .pdf-card-info h4 {
            margin: 0 0 6px 0;
            font-size: 1.1rem;
            color: #0f172a;
        }

        .pdf-card-info p {
            margin: 0;
            color: #64748b;
            font-size: 0.875rem;
        }

        .pdf-card a.view-link {
            padding: 8px 16px;
            background-color: #2563eb;
            color: #ffffff;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .pdf-card a.view-link:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>
<body>

<!-- Top Header Navigation -->
<header class="top-header">
    <div class="nav-actions">
        <div class="header-left">
            <img src="./../favicon.jpeg" alt="logo" id="logo">
        </div>
        <form action="/credits.html" method="get" style="display: inline;">
            <button type="submit" class="generic_button primary" id="credits">Credits</button>
        </form>
        <form action="/" method="get" style="display: inline;">
            <button type="submit" class="generic_button" id="dashboard">Homepage</button>
        </form>
        <form action="/corkboard" method="get" style="display: inline;">
            <button type="submit" class="generic_button" id="corkboard">Corkboard</button>
        </form>
    </div>
</header>

<div class="doc-container">
    <h3>Uploaded Documents</h3>
    <button id="refreshBtn" class="btn-refresh">Refresh List</button>
    <button id="addBtn" class="btn-refresh">Add a file</button>

    <div id="documentsList">
        <p>Loading documents...</p>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://cqxlnmvmfkylozcdffxf.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNxeGxubXZtZmt5bG96Y2RmZnhmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg3NDc4OTMsImV4cCI6MjEwNDMyMzg5M30.mpxEjcWdD9Vy0WsHRL7O8n1fWfnKInsBmOgaYsiv_38';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function loadDocuments() {
        const container = document.getElementById('documentsList');
        container.innerHTML = "<p>Loading documents...</p>";

        try {
            const { data: docs, error } = await supabaseClient
                .from('documents')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) throw error;

            if (!docs || docs.length === 0) {
                container.innerHTML = "<p>No documents found.</p>";
                return;
            }

            container.innerHTML = "";

            docs.forEach(doc => {
                if (doc.file_url) {
                    console.log("Database file_url value:", doc.file_url); // Check your browser console (F12)
                    // Clean leading slashes from file path string
                    const cleanFilePath = doc.file_url.replace(/^\/+/, '');

                    // Dynamically generate public URL for this document
                    const { data } = supabaseClient
                        .storage
                        .from('documents')
                        .getPublicUrl(cleanFilePath);

                    const publicPdfUrl = data.publicUrl;

                    const card = document.createElement('div');
                    card.className = 'pdf-card';
                    card.innerHTML = `
                        <div class="pdf-card-info">
                            <h4>${escapeHtml(doc.name || 'Untitled Document')}</h4>
                            <p>Uploaded by: ${escapeHtml(doc.author || 'Anonymous')}</p>
                        </div>
                        <a href="${doc.file_url}" target="_blank" class="view-link">View PDF</a>
                    `;
                    container.appendChild(card);
                }
            });

        } catch (err) {
            console.error("Fetch Error:", err);
            container.innerHTML = `<p style="color: #ef4444;">Error loading documents: ${escapeHtml(err.message)}</p>`;
        }
    }

    function escapeHtml(str) {
        return String(str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    document.getElementById('refreshBtn').addEventListener('click', loadDocuments);
    document.getElementById('addBtn').addEventListener('click', () => {
        window.location.href = "/documents/add";
    });
    document.addEventListener('DOMContentLoaded', loadDocuments);
</script>
</body>
</html>
