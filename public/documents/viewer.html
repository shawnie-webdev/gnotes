<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoldenNotes - Document Management</title>
    <!-- Supabase JS Client CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e293b;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(51, 65, 85, 0.85);
            padding: 30px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            box-sizing: border-box;
        }

        h2, h3 {
            margin-top: 0;
            color: #ffffff;
        }

        .form-group {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #cbd5e1;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="text"], input[type="file"] {
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(15, 23, 42, 0.6);
            color: #ffffff;
            font-size: 0.95rem;
            box-sizing: border-box;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #60a5fa;
        }

        button {
            padding: 12px 20px;
            background-color: #2563eb;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #1d4ed8;
        }

        button:disabled {
            background-color: #64748b;
            cursor: not-allowed;
        }

        .btn-refresh {
            background-color: #059669;
            margin-bottom: 20px;
        }

        .btn-refresh:hover {
            background-color: #047857;
        }

        .viewer-container {
            margin-top: 20px;
        }

        .pdf-card {
            background: #0f172a;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 25px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .pdf-card h4 {
            margin: 0 0 8px 0;
            font-size: 1.1rem;
            color: #60a5fa;
        }

        .pdf-card p {
            margin: 0 0 15px 0;
            color: #94a3b8;
        }

        object {
            border-radius: 8px;
            background: #ffffff;
        }
    </style>
</head>
<body>

<div class="container">
    <hr style="margin: 30px 0; border-color: rgba(255, 255, 255, 0.2);">

    <!-- READ (Native Viewer Container) -->
    <h3>Uploaded Documents</h3>
    <button id="refreshBtn" class="btn-refresh">Refresh List</button>

    <div id="documentsList" class="viewer-container">
        <p>Loading documents...</p>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://cqxlnmvmfkylozcdffxf.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNxeGxubXZtZmt5bG96Y2RmZnhmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg3NDc4OTMsImV4cCI6MjEwNDMyMzg5M30.mpxEjcWdD9Vy0WsHRL7O8n1fWfnKInsBmOgaYsiv_38';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // 2. READ FUNCTION: Fetches records from 'documents' table
    async function loadDocuments() {
        const container = document.getElementById('documentsList');
        container.innerHTML = "<p>Loading documents...</p>";

        try {
            const { data: docs, error } = await supabaseClient
                .from('documents')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) throw error;

            if (!docs || docs.length === 0) {
                container.innerHTML = "<p>No documents found.</p>";
                return;
            }

            container.innerHTML = "";

            docs.forEach(doc => {
                if (doc.file_url) {
                    const card = document.createElement('div');
                    const { data } = supabaseClient
                        .storage
                        .from('documents')
                        .getPublicUrl('path/to/file.pdf');

                    const publicPdfUrl = data.publicUrl;

                    card.className = 'pdf-card';
                    card.innerHTML = `
                        <h4>${escapeHtml(doc.name)}</h4>
                        <p><small>Uploaded by: ${escapeHtml(doc.author)}</small></p>
                        <a href="${publicPdfUrl}">View this PDF file</a>
                    `;
                    container.appendChild(card);
                }
            });

        } catch (err) {
            console.error("Fetch Error:", err);
            container.innerHTML = `<p style="color: #ef4444;">Error loading documents: ${err.message}</p>`;
        }
    }

    function escapeHtml(str) {
        return String(str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    document.getElementById('refreshBtn').addEventListener('click', loadDocuments);
    document.addEventListener('DOMContentLoaded', loadDocuments);
</script>
</body>
</html>
