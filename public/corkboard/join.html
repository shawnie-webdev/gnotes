<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoldenNotes - Join A Corkboard</title>
    <link rel="stylesheet" href="../master-combined.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../auth/theme.js"></script>

    <style>
        #form {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            width: 100%;
        }

        .form-input {
            width: 100%;
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--deepest-background);
            color: var(--main-text);
            font-size: 0.95rem;
            text-align: center;
            box-sizing: border-box;
        }

        .form-input::placeholder {
            color: var(--muted-text);
        }

        #floating-join a {
            color: var(--muted-text);
            font-size: 0.85rem;
            text-decoration: underline;
        }

        #floating-join a:hover {
            color: var(--main-text);
        }

        .create-room-wrap {
            display: flex;
            justify-content: center;
            margin: 20px 0 10px;
        }
    </style>
</head>
<body>

<header class="top-header">
    <div class="nav-actions">
        <div class="header-left">
            <img src="../favicon.jpeg" alt="logo" id="logo">
        </div>
        <a href="/credits.html" class="btn btn-primary" id="credits">Credits</a>
        <a href="/" class="btn btn-secondary" id="dashboard">Homepage</a>
        <div class="dropdown">
            <button class="dropbtn btn btn-secondary">Study</button>
            <div class="dropdown-content">
                <a href="/corkboard" class="btn btn-secondary" id="cb">Corkboard</a>
                <a href="/study" class="btn btn-secondary" id="study">Study Guides</a>
                <a href="/documents" class="btn btn-secondary" id="documents">Documents</a>
                <a href="/calendar" class="btn btn-secondary" id="calendar">Calendar</a>
            </div>
        </div>

        <a href="/dashboard/settings" class="btn btn-secondary" id="settings-nav">Settings</a>
        <a href="/dashboard" class="btn btn-secondary" id="d-nav">Dashboard</a>
    </div>
</header>


<h1 class="center">Join a Corkboard Room</h1>
<h3 class="center">Join a Corkboard Room and collaborate with others</h3>
<div class="hero-container" style="display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 20px; min-height: 100vh; padding: 20px 0;">

    <div id="floating-join" class="card" style="width: 100%; max-width: 400px; text-align: center;">
        <h1>Manual Join</h1>

        <form id="form">
            <input
                    class="form-input"
                    type="text"
                    id="roomid"
                    name="roomid"
                    pattern="[A-Za-z0-9]{6}"
                    maxlength="6"
                    placeholder="Your 6-character room ID"
                    inputmode="text"
                    required
            >
            <input
                    class="form-input"
                    type="text"
                    id="subject"
                    name="subject"
                    inputmode="text"
                    placeholder="Enter your subject (use 'main' if no subject)"
                    required
            >
            <button id="submit" type="submit" class="btn btn-secondary">Attempt to join</button>
        </form>
        <a href="/corkboard/help">Don't know your room ID?</a>
    </div>

    <h3>or</h3>

    <div class="card" style="width: 100%; max-width: 400px; text-align: center; display: flex; flex-direction: column; gap: 10px;">
        <h1>Autoselect Your Room</h1>

        <label for="section">Section:</label>
        <select name="section" id="section" class="form-control">
            <option value="GOLD32">Gold (Grade 7)</option>
            <option value="PEAR32">Pearl (Grade 7)</option>
            <option value="DIAM32">Diamond (Grade 7)</option>
            <option value="EMER32">Emerald (Grade 7)</option>
            <option value="G8_1">Camia (Grade 8)</option>
            <option value="G8_2">Dahila (Grade 8)</option>
            <option value="G8_3">Rosal (Grade 8)</option>
            <option value="G8_4">Section 4(Grade 8)</option>
            <option value="G9_1">Section 1 (Grade 9)<option>
            <option value="G9_2">Section 2 (Grade 9)<option>
            <option value="G9_3">Section 3 (Grade 9)</option>
            <option value="G9_4">Section 4 (Grade 9)<option>
            <option value="G10_1">Section 1 (Grade 10)<option>
            <option value="G10_2">Section 2 (Grade 10)<option>
            <option value="G10_3">Section 3 (Grade 10)</option>
            <option value="G10_4">Section 4 (Grade 10)<option>
            <option value="G11_1">Section 1 (Grade 11)<option>
            <option value="G11_2">Section 2 (Grade 11)<option>
            <option value="G11_3">Section 3 (Grade 11)</option>
            <option value="G11_4">Section 4 (Grade 11)<option>
            <option value="G12_1">Section 1 (Grade 12)<option>
            <option value="G12_2">Section 2 (Grade 12)<option>
            <option value="G12_3">Section 3 (Grade 12)</option>
            <option value="G12_4">Section 4 (Grade 12)<option>
        </select>

        <label for="auto-subject">Subject:</label>
        <select name="subject" id="auto-subject" class="form-control">
            <option value="main">Main room (generic messages)</option>
            <option value="adtc">ADTech</option>
            <option value="vled">Values Education</option>
            <option value="isci">Integrated Science</option>
            <option value="ssci">Social Science</option>
            <option value="csci">Computer Science</option>
            <option value="esci">Earth Science</option>
            <option value="engl">English</option>
            <option value="fili">Filipino</option>
            <option value="phed">PE</option>
            <option value="hlth">Health</option>
            <option value="musc">Music</option>
        </select>

        <button class="generic_button" id="autoselect-join" style="margin-top: 10px;">Join</button>
    </div>
</div>

<script>
    function sanitizeSegment(value, fallback) {
        return String(value || fallback)
            .trim()
            .replace(/[^A-Za-z0-9_-]/g, '')
            .slice(0, 32) || fallback;
    }

    function goToRoom(roomId, subject) {
        const id = sanitizeSegment(roomId, '').toUpperCase();
        const subj = sanitizeSegment(subject, 'main');
        if (!/^[A-Za-z0-9]{6}$/.test(id)) {
            alert('Room ID must be exactly 6 letters or numbers.');
            return;
        }
        window.location.href = `/corkboard/join?room=${encodeURIComponent(id + '-' + subj)}`;
    }

    document.getElementById('form').addEventListener('submit', (e) => {
        e.preventDefault();
        goToRoom(
            document.getElementById('roomid').value,
            document.getElementById('subject').value
        );
    });

    document.getElementById("autoselect-join").addEventListener('click', () => {
        const sec = document.getElementById('section').value
        const sbj = document.getElementById('auto-subject').value

        console.log(sec, sbj);
        goToRoom(sec, sbj)
    })
</script>
</body>
</html>
