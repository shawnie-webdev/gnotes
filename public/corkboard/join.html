<h1 class="center">Join a Corkboard Room</h1>
<h3 class="center">Join a Corkboard Room and collaborate with others</h3>
<div class="hero-container" style="display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 20px; min-height: 100vh; padding: 20px 0;">

    <button class="btn btn-secondary" id="new-room">Create a Room</button>

    <div class="card" style="width: 100%; max-width: 400px; text-align: center; display: flex; flex-direction: column; gap: 10px;">
        <h1>Autoselect Your Room</h1>

        <label for="section">Section:</label>
        <select name="section" id="section" class="form-control">
            <option value="GOLD32">Gold (Grade 7)</option>
            <option value="PEAR32">Pearl (Grade 7)</option>
            <option value="DIAM32">Diamond (Grade 7)</option>
            <option value="EMER32">Emerald (Grade 7)</option>
            <option value="GRAD81">Camia (Grade 8)</option>
            <option value="GRAD82">Dahila (Grade 8)</option>
            <option value="GRAD83">Rosal (Grade 8)</option>
            <option value="GRAD84">Section 4(Grade 8)</option>
            <option value="GRAD91">Section 1 (Grade 9)</option>
            <option value="GRAD92">Section 2 (Grade 9)</option>
            <option value="GRAD93">Section 3 (Grade 9)</option>
            <option value="GRAD94">Section 4 (Grade 9)</option>
            <option value="GRA101">Section 1 (Grade 10)</option>
            <option value="GRA102">Section 2 (Grade 10)</option>
            <option value="GRA103">Section 3 (Grade 10)</option>
            <option value="GRA104">Section 4 (Grade 10)</option>
            <option value="GRA111">Section 1 (Grade 11)</option>
            <option value="GRA112">Section 2 (Grade 11)</option>
            <option value="GRA113">Section 3 (Grade 11)</option>
            <option value="GRA114">Section 4 (Grade 11)</option>
            <option value="GRA121">Section 1 (Grade 12)</option>
            <option value="GRA122">Section 2 (Grade 12)</option>
            <option value="GRA123">Section 3 (Grade 12)</option>
            <option value="GRA124">Section 4 (Grade 12)</option>
        </select>

        <label for="auto-subject">Subject:</label>
        <select name="subject" id="auto-subject" class="form-control">
            <option value="main">Main room (generic messages)</option>
            <option value="adtc">ADTech</option>
            <option value="vled">Values Education</option>
            <option value="isci">Integrated Science</option>
            <option value="ssci">Social Science</option>
            <option value="csci">Computer Science</option>
            <option value="esci">Earth Science</option>
            <option value="engl">English</option>
            <option value="fili">Filipino</option>
            <option value="phed">PE</option>
            <option value="hlth">Health</option>
            <option value="musc">Music</option>
        </select>
        <button class="generic_button" id="autoselect-join" style="margin-top: 10px;">Join</button>
    </div>

    <h3>or</h3>

    <div id="floating-join" class="card" style="width: 100%; max-width: 400px; text-align: center;">
        <h1>Manual Join</h1>

        <form id="form">
            <input
                    class="form-input"
                    type="text"
                    id="roomid"
                    name="roomid"
                    pattern="[A-Za-z0-9]{6}"
                    maxlength="6"
                    placeholder="Your 6-character room ID"
                    inputmode="text"
                    required
            >
            <input
                    class="form-input"
                    type="text"
                    id="subject"
                    name="subject"
                    inputmode="text"
                    placeholder="Enter your subject (use 'main' if no subject)"
                    required
            >
            <button id="submit" type="submit" class="btn btn-secondary">Attempt to join</button>
        </form>
    </div>

    </div>
</div>

<script>
    function getkey() {
        // 1. Get the current Unix timestamp in seconds
        const unix_time = Math.floor(Date.now() / 1000);

        // 2. Calculate X using *4 so that it changes every 1/4 second
        const x = Math.ceil((unix_time - 1791019852) * 4);

        // 3. Boundary check to ensure it stays within the Base36 6-character limit (0 to 2,176,782,335)
        if (x < 0 || x > 2176782335) {
            throw new RangeError(`Calculated index X (${x}) is out of bounds. Must be between 0 and 2,176,782,335.`);
        }

        // 4. Convert X to Base36, force uppercase, and pad to 6 characters
        return x.toString(36).toUpperCase().padStart(6, '0');
    }
    function sanitizeSegment(value, fallback) {
        return String(value || fallback)
            .trim()
            .replace(/[^A-Za-z0-9_-]/g, '')
            .slice(0, 32) || fallback;
    }

    function goToRoom(roomId, subject) {
        const id = sanitizeSegment(roomId, '').toUpperCase();
        const subj = sanitizeSegment(subject, 'main');
        if (!/^[A-Za-z0-9]{6}$/.test(id)) {
            alert('Room ID must be exactly 6 letters or numbers.');
            return;
        }
        window.location.href = `/corkboard/join?room=${encodeURIComponent(id + '-' + subj)}`;
    }

    document.getElementById('form').addEventListener('submit', (e) => {
        e.preventDefault();
        goToRoom(
            document.getElementById('roomid').value,
            document.getElementById('subject').value
        );
    });

    document.getElementById("autoselect-join").addEventListener('click', () => {
        const sec = document.getElementById('section').value
        const sbj = document.getElementById('auto-subject').value

        console.log(sec, sbj);
        goToRoom(sec, sbj)
    })

    document.getElementById("new-room").addEventListener('click', (e) => {
        const key = getkey();
        window.location.href = `/corkboard/join?room=${encodeURIComponent(key)}-main`;
    })
</script>
</body>
