<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoldenNotes v1.1</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">

    <!-- Supabase JS Client via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/auth/config.js"></script>
    <script src="/auth/theme.js"></script>
    <link rel="stylesheet" href="/master-combined.css">
</head>
<body>

<header class="top-header">
    <div class="nav-actions">
        <div class="header-left">
            <img src="../favicon.jpeg" alt="logo" id="logo">
        </div>
        <a href="/credits.html" class="btn btn-primary" id="credits">Credits</a>
        <a href="/" class="btn btn-secondary" id="dashboard">Homepage</a>
        <div class="dropdown">
            <button class="dropbtn btn btn-secondary">Study</button>
            <div class="dropdown-content">
                <a href="/corkboard" class="btn btn-secondary" id="cb">Corkboard</a>
                <a href="/study" class="btn btn-secondary" id="study">Study Guides</a>
                <a href="/documents" class="btn btn-secondary" id="documents">Documents</a>
                <a href="/calendar" class="btn btn-secondary" id="calendar">Calendar</a>
            </div>
        </div>

        <a href="/dashboard/settings" class="btn btn-secondary" id="settings-nav">Settings</a>
        <a href="/dashboard" class="btn btn-secondary" id="d-nav">Dashboard</a>
    </div>
</header>

<main>
    <h1 id="title">GoldenNotes Manuals</h1>
    <div class="hero-container">
        <div class="card centerx" id="page" style="max-width: 80%">
        </div>
    </div>
    <button id="return" class=" btn btn-secondary">Go back</button>
</main>

<script>
    const title = document.getElementById('title');
    const card = document.getElementById('page');

    const URLParams = new URLSearchParams(window.location.search);
    const page = URLParams.get("page");

    switch (page) {
        case "1":
            title.innerText = "GoldenNotes Manuals: Ranks";
            card.innerHTML = "<h3>What are Ranks?</h3>" +
                "<br><p>" +
                "Ranks are used to control the formality in GoldenNotes, the first rank, is 'Viewer', a Viewer has FULL access to view all study guides<br>" +
                "and documents, you can post notes in corkboards, announcements and search up people in the <a href='/man-page?page=1'>dashboard</a>. An Editor has full access<br>" +
                "to study guides and dcouments, mostly they have the same permissions as a Viewer, but they can post study guides, documents. An Moderator has access to<br>" +
                "like an Viewer, but they cannot post study guides and documents (for the time being). They have access to the <a href='/mod-page'>Moderator Page</a>. And finally, an Admin<br>" +
                "Has viewer access as well (for the time being). They have FULL access to the developer's console (the page is disclosed), which gives the Admin FULL BASH TERMINAL ACCESS<br>" +
                "of the WHOLE WEBSITE, The people with Admin roles also has debugger tools, and are also considered a Developer, and a Developer has access to the GitHub source code</p>";
            break;
        case "2":
            title.innerText = "GoldenNotes Manuals: Dashboard";
            card.innerHTML = "<h3>The dashboard</h3>" +
                "<br><p>" +
                "the dashboard is a blah blah" +
                "</p>"
            break;
        case "3":
            title.innerText = "GoldenNotes Manuals: Corkboard";
            card.innerHTML = "<h3>The corkboard</h3>" +
                "<br><p>" +
                "the corkboard is a blah blah" +
                "</p>"
            break;

        default:
            title.innerText = "GoldenNotes Manuals";
            card.innerHTML = "<p>Welcome to the Manual! Here you can view some manuals we have here!</p>" +
                "<form id=\"spinboxForm\">\n" +
                "  <label for=\"pageNumber\">Select Page:</label>\n" +
                "  <input class='form-input'\n" +
                "    type=\"number\" \n" +
                "    id=\"pageNumber\" \n" +
                "    min=\"1\" \n" +
                "    max=\"100\" \n" +
                "    value=\"1\"\n" +
                "    required\n" +
                "  >\n" +
                "  <button type=\"submit\" class=\"btn btn-primary\" id=\"submitPage\">Go to Page</button>\n" +
                "</form>\n" +
                "<h4>If you tried to goto a page and it didn't work, it means that that page does not exist </h4>";

            // Attach event listener directly after elements are inserted into the DOM
            document.getElementById('spinboxForm').addEventListener('submit', function(event) {
                event.preventDefault();
                const pageValue = document.getElementById('pageNumber').value;
                const targetUrl = window.location.pathname + `?page=${encodeURIComponent(pageValue)}`;
                window.location.href = targetUrl;
            });
            break;

    }
    document.getElementById("return").addEventListener('click', function(event) {
        history.back()
    })
</script>
</body>
</html>
