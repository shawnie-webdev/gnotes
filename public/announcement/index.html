<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoldenNotes - Announcements</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/auth/config.js"></script>
    <script src="/auth/theme.js"></script>
    <link rel="stylesheet" href="/master-combined.css">
    <style>
        .announcements-container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .section-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 30px;
        }
        .announcement-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 20px;
            margin-bottom: 20px;
            transition: var(--transition);
            position: relative;
        }
        .announcement-card:hover {
            border-color: var(--main-gold);
            box-shadow: var(--shadow-md);
        }
        .announcement-meta {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: var(--muted-text);
            margin-bottom: 10px;
            font-family: var(--mono-font);
        }
        .type-badge {
            padding: 2px 8px;
            border-radius: 4px;
            text-transform: uppercase;
            font-weight: bold;
        }
        .type-calendar { background: rgba(122, 176, 255, 0.2); color: var(--accent-blue); }
        .type-posted { background: rgba(217, 164, 65, 0.2); color: var(--main-gold); }
        .announcement-title {
            font-family: var(--display-font);
            font-size: 1.4rem;
            color: var(--main-text);
            margin-bottom: 10px;
        }
        .announcement-body {
            color: var(--secondary-text);
            line-height: 1.6;
        }
    </style>
</head>
<body>
<header class="top-header">
    <div class="header-left">
        <img src="/favicon.jpeg" alt="logo" id="logo">
        <span style="font-family: var(--display-font); font-weight: 700; color: var(--main-gold); font-size: 1.2rem;">GoldenNotes</span>
    </div>
    <div class="nav-actions">
        <a href="/" class="btn btn-secondary">Homepage</a>
        <a href="/study/course-list.html" class="btn btn-secondary">Library</a>
        <a href="/corkboard/main.html" class="btn btn-secondary">Corkboard</a>
        <a href="/auth/dashboard.html" class="btn btn-secondary">Dashboard</a>
        <div class="dropdown">
            <button class="dropbtn btn btn-secondary">Resources</button>
            <div class="dropdown-content">
                <a href="/corkboard/main.html">Corkboard</a>
                <a href="/study/course-list.html">Study Guides</a>
                <a href="/documents/viewer.html">Documents</a>
                <a href="/calendar/index.html">Calendar</a>
            </div>
        </div>
        <a href="/auth/login.html" class="btn btn-secondary" id="login">Login</a>
        <a href="/auth/signup.html" class="btn btn-primary">Sign Up</a>
    </div>
</header>

<div class="announcements-container">
    <div class="section-header">
        <span style="font-size: 2rem;">📢</span>
        <h1>Announcements</h1>
    </div>
    <div id="announcements-list">
        <p>Loading announcements...</p>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', async () => {
        const listContainer = document.getElementById('announcements-list');
        const supabaseClient = window.supabaseClient;

        if (!supabaseClient) return;

        const { data: announcements, error } = await supabaseClient
            .from('announcements')
            .select('*')
            .order('created-on', { ascending: false });

        if (error) {
            listContainer.innerHTML = `<p style="color: var(--danger);">Error loading announcements: ${error.message}</p>`;
            return;
        }

        if (!announcements || announcements.length === 0) {
            listContainer.innerHTML = '<p>No announcements yet.</p>';
            return;
        }

        listContainer.innerHTML = '';
        announcements.forEach(ann => {
            const typeClass = ann['announcement-type'] === 'calendar' ? 'type-calendar' : 'type-posted';
            const typeLabel = ann['announcement-type'] === 'calendar' ? '📅 Calendar' : '📝 Posted';

            const card = document.createElement('div');
            card.className = 'announcement-card';
            card.innerHTML = `
                <div class="announcement-meta">
                    <span class="type-badge ${typeClass}">${typeLabel}</span>
                    <span>${new Date(ann['created-on']).toLocaleDateString()}</span>
                </div>
                <div class="announcement-title">${ann.author || 'Anonymous'}</div>
                <div class="announcement-body">${ann.content || 'No content provided.'}</div>
            `;
            listContainer.appendChild(card);
        });
    });
</script>
</body>
</html>
